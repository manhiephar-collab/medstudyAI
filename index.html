<style>

  :root{
    --ink:#0F2A33;
    --ink-2:#173D47;
    --paper:#F2FBFC;
    --paper-2:#F7FBFF;
    --card:rgba(255,255,255,.70);
    --card-strong:rgba(255,255,255,.88);
    --glass:rgba(255,255,255,.58);
    --line:rgba(56,130,139,.16);
    --muted:#66808A;
    --accent:#0EA5A4;
    --accent-2:#37B8C8;
    --accent-dark:#087E84;
    --accent-soft:#DDF7F5;
    --blue:#4C8BF5;
    --blue-soft:#EAF2FF;
    --violet:#8B5CF6;
    --violet-soft:#F1EBFF;
    --warm:#F59E6B;
    --warm-soft:#FFF1E8;
    --correct:#2E9A6D;
    --correct-soft:#E4F7EE;
    --wrong:#D95D68;
    --wrong-soft:#FDEDEF;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 18px 45px rgba(22,88,101,.10);
    --shadow-soft:0 8px 24px rgba(23,82,94,.08);
    --font-main:'Be Vietnam Pro','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;color:var(--ink);font-family:var(--font-main);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    background:
      radial-gradient(circle at 88% 8%, rgba(64,202,213,.20), transparent 23%),
      radial-gradient(circle at 18% 72%, rgba(74,138,245,.13), transparent 28%),
      linear-gradient(135deg,#F8FCFF 0%,#F0FBFB 46%,#F7FCFF 100%);
    overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:999px;filter:blur(2px);}
  body::before{width:360px;height:360px;right:-120px;top:120px;background:rgba(96,224,215,.10);}
  body::after{width:420px;height:420px;left:22%;bottom:-230px;background:rgba(98,155,255,.10);}
  h1,h2,h3,h4{font-family:var(--font-main);font-weight:700;margin:0 0 8px;letter-spacing:-.35px;}
  button,input,textarea,select{font:inherit;}
  input,textarea,select{outline:none;}
  input:focus,textarea:focus,select:focus{border-color:rgba(14,165,164,.48)!important;box-shadow:0 0 0 4px rgba(14,165,164,.10);}
  .app{display:flex;min-height:100vh;width:100%;}

  .sidebar{
    width:320px;flex-shrink:0;padding:18px 16px;display:flex;flex-direction:column;gap:14px;
    height:100vh;position:sticky;top:0;overflow-y:auto;z-index:30;
    background:rgba(247,253,254,.64);border-right:1px solid rgba(68,135,144,.14);
    backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:10px 0 35px rgba(50,101,111,.04);
  }
  .sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:rgba(76,139,150,.18);border-radius:99px}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:2px 4px 14px;border-bottom:1px solid var(--line);}
  .brand-head{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#49D4CD,#0E9EA5);box-shadow:0 8px 20px rgba(14,165,164,.22);position:relative;}
  .brand .mark::before,.brand .mark::after{content:"";position:absolute;background:white;border-radius:4px;}
  .brand .mark::before{width:17px;height:6px}.brand .mark::after{width:6px;height:17px}
  .brand h1{font-size:20px;letter-spacing:-.45px;margin:0;color:#0B2935;}
  .brand h1::after{content:" AI";color:var(--accent);}
  .brand-sub{font-size:11px;color:var(--muted);padding-left:44px;font-weight:500;margin-top:-3px;}

  .api-box{padding:13px;background:rgba(255,255,255,.60);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-soft);backdrop-filter:blur(16px);}
  .api-box label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:7px;font-weight:700;}
  .api-input-wrap{display:flex;gap:7px;margin-bottom:7px;}
  .api-box input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;background:rgba(255,255,255,.74);color:var(--ink);}
  .api-box a{display:block;font-size:11px;color:var(--accent-dark);margin-top:5px;text-decoration:none;font-weight:600;}
  .api-box a:hover{text-decoration:underline}.sync-status{font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:600;min-height:16px;}

  #subjectList{gap:5px!important;}
  .subject-block{border-bottom:1px solid rgba(56,130,139,.10);padding-bottom:8px;margin-bottom:1px;}
  .subject-head{display:flex;align-items:center;justify-content:space-between;padding:9px 9px;cursor:pointer;border-radius:11px;transition:.18s ease;}
  .subject-head:hover{background:rgba(215,246,245,.72);transform:translateX(2px);}
  .subject-head .name{font-weight:650;font-size:13.5px;word-break:break-word;color:var(--ink-2);}
  .subject-head .chev{color:var(--muted);font-size:10px;transition:transform .18s;}
  .subject-head.open .chev{transform:rotate(90deg);color:var(--accent);}
  .action-btns{display:flex;align-items:center;gap:2px}.action-btn{color:var(--muted);font-size:12px;cursor:pointer;padding:3px 6px;border-radius:7px;opacity:0;transition:.15s ease;}
  .subject-head:hover .action-btn,.lesson-item:hover .action-btn{opacity:.85}.action-btn:hover{color:var(--accent-dark);background:rgba(14,165,164,.10);opacity:1!important}.action-btn.del:hover{color:var(--wrong);background:var(--wrong-soft);}
  .lesson-list{padding-left:14px;margin-top:4px;display:flex;flex-direction:column;gap:3px}.lesson-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink);border-left:2px solid transparent;transition:.15s ease;}
  .lesson-item:hover{background:rgba(234,242,255,.72)}.lesson-item.active{background:linear-gradient(90deg,rgba(221,247,245,.92),rgba(234,242,255,.62));border-left-color:var(--accent);color:var(--accent-dark);font-weight:650;}
  .add-row{display:flex;gap:6px;padding:7px 3px 0}.add-row input,.add-subject input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.72);font-size:12.5px;color:var(--ink);}
  .sidebar-footer{margin-top:auto;padding-top:10px}.add-subject{display:flex;gap:7px;padding:9px;background:rgba(255,255,255,.48);border:1px solid var(--line);border-radius:15px;backdrop-filter:blur(14px);}

  .btn{border:1px solid transparent;border-radius:11px;padding:8px 14px;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#0EAAA8,#07858D);color:#fff;white-space:nowrap;font-weight:650;box-shadow:0 8px 18px rgba(14,165,164,.18);transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(14,165,164,.23)}.btn:active{transform:translateY(0)}.btn.ghost{background:rgba(255,255,255,.62);color:var(--accent-dark);border-color:rgba(14,165,164,.24);box-shadow:none}.btn.ghost:hover{background:var(--accent-soft)}.btn.warm{background:linear-gradient(135deg,#1CB9B3,#0A9099)}.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}.btn:disabled{opacity:.48;cursor:default;transform:none!important;box-shadow:none!important;}

  .main{flex:1;min-width:0;padding:30px 42px 64px;max-width:none;position:relative;}
  .main::before{content:"+";position:fixed;right:4vw;top:10vh;font-size:220px;font-weight:700;color:rgba(61,200,197,.055);line-height:1;pointer-events:none;z-index:-1;transform:rotate(8deg);}
  .home-shell{max-width:1180px;margin:0 auto;min-height:calc(100vh - 94px);display:flex;flex-direction:column;justify-content:center;padding:28px 0 60px;}
  .home-kicker{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(225,249,248,.76);border:1px solid rgba(14,165,164,.14);color:var(--accent-dark);font-size:12px;font-weight:700;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px)}
  .hero{text-align:center;margin:42px auto 38px;max-width:780px}.hero h2{font-size:48px;line-height:1.08;margin-bottom:10px;color:#0B2940;letter-spacing:-1.7px}.hero h2 span{color:var(--accent)}.hero p{font-size:18px;color:#688399;margin:0}.hero .quote{display:block;margin-top:7px;font-size:13px;color:#7A91A0;font-style:italic;}
  .feature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:0 auto 30px;width:100%;}.feature-card{padding:24px 19px;min-height:190px;text-align:center;border:1px solid rgba(80,143,151,.14);border-radius:22px;background:rgba(255,255,255,.58);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 18px 38px rgba(45,104,116,.08);transition:.2s ease;}.feature-card:hover{transform:translateY(-4px);box-shadow:0 22px 46px rgba(45,104,116,.13)}
  .feature-icon{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:700}.feature-card:nth-child(1) .feature-icon{background:var(--accent-soft);color:var(--accent)}.feature-card:nth-child(2) .feature-icon{background:var(--blue-soft);color:var(--blue)}.feature-card:nth-child(3) .feature-icon{background:var(--violet-soft);color:var(--violet)}.feature-card:nth-child(4) .feature-icon{background:#FFEAF0;color:#F05275}.feature-card h3{font-size:15px;margin-bottom:6px}.feature-card p{font-size:12.5px;color:var(--muted);margin:0;}
  .home-tip{margin:0 auto;text-align:center;color:var(--muted);font-size:12.5px}.home-tip strong{color:var(--accent-dark)}

  .lesson-header{max-width:1180px;margin:0 auto 16px;padding:17px 20px;background:rgba(255,255,255,.50);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);box-shadow:var(--shadow-soft)}
  .eyebrow{color:var(--accent-dark);font-size:12px;margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.lesson-title{font-size:27px;font-weight:750;color:#0B2940}.tabs{max-width:1180px;margin:14px auto 18px;display:flex;gap:8px;border:none;padding:6px;background:rgba(255,255,255,.50);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);width:max-content;max-width:100%;overflow-x:auto}.tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);border:none!important;border-radius:10px;white-space:nowrap;font-weight:600;transition:.18s ease}.tab.active{color:var(--accent-dark);background:rgba(221,247,245,.88);font-weight:700;box-shadow:inset 0 0 0 1px rgba(14,165,164,.08)}
  #tabBody{max-width:1180px;margin:0 auto}.card,.q-box{background:rgba(255,255,255,.69);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(145%)}
  .upload-box{border:1.5px dashed rgba(14,165,164,.38);padding:36px 20px;border-radius:16px;text-align:center;background:linear-gradient(135deg,rgba(226,249,247,.66),rgba(238,245,255,.58));margin-bottom:16px;cursor:pointer;transition:.2s ease}.upload-box:hover,.upload-box.dragover{border-color:var(--accent);background:linear-gradient(135deg,rgba(216,248,246,.92),rgba(230,242,255,.85));transform:translateY(-1px)}
  .file-queue{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.file-chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:rgba(240,249,249,.88);border:1px solid var(--line);border-radius:11px;font-size:12.5px;color:var(--ink)}.file-chip .chip-del{cursor:pointer;color:var(--muted);font-weight:bold;padding:0 4px}.file-chip .chip-del:hover{color:var(--wrong)}
  .field{margin-bottom:16px}.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:650}.field textarea{width:100%;min-height:100px;resize:vertical;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.72);line-height:1.55;color:var(--ink)}
  .quiz-options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px;padding:14px;background:rgba(244,250,251,.66);border:1px solid var(--line);border-radius:14px}.quiz-options-grid label{font-size:12px;color:var(--ink-2);font-weight:650;display:block;margin-bottom:6px}.quiz-options-grid select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.78);font-size:13px;color:var(--ink)}.status-line{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}

  .mindmap-help{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.48);border:1px solid var(--line);backdrop-filter:blur(12px)}.mindmap-help .hint{font-size:12.5px;color:var(--muted)}
  .mindmap-wrapper{border:1px solid rgba(91,153,163,.18);border-radius:22px;background:linear-gradient(145deg,#F7FCFD,#ECF8F8 52%,#EEF5FF);overflow:hidden;position:relative;box-shadow:0 24px 55px rgba(28,93,106,.12);min-height:720px}.mindmap-wrapper::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 50%,rgba(74,139,245,.10),transparent 34%),radial-gradient(circle at 78% 50%,rgba(14,165,164,.12),transparent 38%)}
  .mindmap-toolbar{position:absolute;top:14px;right:14px;z-index:20;display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.66);backdrop-filter:blur(14px);padding:6px;border-radius:12px;border:1px solid rgba(56,130,139,.16);max-width:calc(100% - 28px);box-shadow:var(--shadow-soft)}.mindmap-toolbar button{background:rgba(244,251,251,.86);color:var(--ink-2);border:1px solid rgba(56,130,139,.12);border-radius:9px;padding:7px 10px;font-size:11.5px;cursor:pointer;font-weight:650}.mindmap-toolbar button:hover{background:var(--accent-soft);color:var(--accent-dark);transform:translateY(-1px)}
  #mindmapViewport{width:100%;height:720px;display:block;cursor:grab;touch-action:none;position:relative;z-index:1}#mindmapViewport:active{cursor:grabbing}.mm-link{fill:none;stroke:#86ABB3;stroke-width:1.55px;opacity:.72;vector-effect:non-scaling-stroke}.mm-node{cursor:default}.mm-node-card{stroke:rgba(255,255,255,.7);stroke-width:1px;filter:drop-shadow(0 6px 10px rgba(39,102,113,.13))}.mm-node.depth-0 .mm-node-card{fill:#247F89}.mm-node.depth-1 .mm-node-card{fill:#4C8BF5}.mm-node.depth-2 .mm-node-card{fill:#2CA59C}.mm-node.depth-3 .mm-node-card{fill:#62B8B0}.mm-node.depth-4 .mm-node-card{fill:#7CBDB8}.mm-node-label{fill:#fff;font-size:13.5px;font-weight:550;font-family:var(--font-main);pointer-events:none}.mm-node.depth-0 .mm-node-label{font-size:14.5px;font-weight:750}.mm-node.depth-1 .mm-node-label{font-size:13.8px;font-weight:650}.mm-toggle{cursor:pointer}.mm-toggle circle{fill:#fff;stroke:rgba(36,127,137,.22);stroke-width:1px;filter:drop-shadow(0 3px 5px rgba(29,89,99,.16))}.mm-toggle:hover circle{fill:#E5F7F6}.mm-toggle text{fill:#1B7E85;font-size:12px;font-weight:800;font-family:var(--font-main);text-anchor:middle;dominant-baseline:central;pointer-events:none}.mm-hit{fill:transparent;cursor:pointer}

  .quiz-top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}.q-progress{font-size:13px;color:var(--muted);font-weight:650}.q-text{font-size:16px;margin-bottom:16px;font-weight:700;color:var(--ink-2)}.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:rgba(255,255,255,.70);font-size:14px;transition:.15s ease}.opt:hover{border-color:rgba(14,165,164,.45);background:rgba(237,250,249,.82);transform:translateX(2px)}.opt.correct{background:var(--correct-soft);border-color:var(--correct)}.opt.wrong{background:var(--wrong-soft);border-color:var(--wrong)}.opt.disabled{cursor:default}.opt .letter{width:27px;height:27px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;flex-shrink:0;color:var(--muted);font-weight:750}.opt.correct .letter{background:var(--correct);border-color:var(--correct);color:#fff}.opt.wrong .letter{background:var(--wrong);border-color:var(--wrong);color:#fff}.explain{margin-top:14px;padding:14px 16px;background:rgba(255,246,226,.82);border-radius:12px;font-size:13.5px;border-left:3.5px solid var(--warm);line-height:1.55}.q-nav{display:flex;justify-content:space-between;margin-top:18px}.score-card{text-align:center;padding:42px 20px}.score-num{font-weight:800;font-size:50px;color:var(--accent)}.review-list .rev-item{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;background:rgba(255,255,255,.66);backdrop-filter:blur(12px)}.tag{font-size:10.5px;padding:4px 8px;border-radius:20px;font-weight:750;display:inline-block;margin-right:6px}.tag.ok{background:var(--correct-soft);color:var(--correct)}.tag.bad{background:var(--wrong-soft);color:var(--wrong)}.hist-item{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.66);backdrop-filter:blur(12px);transition:.15s ease}.hist-item:hover{border-color:rgba(14,165,164,.42);transform:translateY(-1px);box-shadow:var(--shadow-soft)}
  .loader{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:1100px){.feature-grid{grid-template-columns:repeat(2,1fr)}.main{padding:26px 28px 54px}.hero h2{font-size:42px}}
  @media(max-width:820px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--line);padding:14px}.brand-sub{padding-left:44px}.main{padding:22px 16px 44px}.home-shell{min-height:auto;padding-top:20px}.hero{margin:28px auto}.hero h2{font-size:36px}.feature-grid{grid-template-columns:1fr 1fr;gap:12px}.feature-card{min-height:170px;padding:20px 14px}.lesson-header{padding:15px}.tabs{width:100%;justify-content:flex-start}.mindmap-help{align-items:flex-start;flex-direction:column}#mindmapViewport{height:620px}.mindmap-wrapper{min-height:620px}}
  @media(max-width:520px){.feature-grid{grid-template-columns:1fr}.hero h2{font-size:32px}.hero p{font-size:15px}.api-input-wrap{flex-wrap:wrap}.api-input-wrap .btn{width:100%}.lesson-title{font-size:22px}.card,.q-box{padding:17px}.quiz-options-grid{grid-template-columns:1fr}.q-nav{gap:8px}.q-nav .btn{flex:1}.mindmap-toolbar{left:10px;right:10px;top:10px;justify-content:center}#mindmapViewport{height:560px}.mindmap-wrapper{min-height:560px}}


  /* ===== HỎI AI TỪ MIND MAP ===== */
  .ai-knowledge-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(8,34,42,.30);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .ai-knowledge-modal.open{display:flex}
  .ai-knowledge-panel{width:min(720px,100%);max-height:min(82vh,760px);overflow:auto;background:rgba(255,255,255,.94);border:1px solid rgba(56,130,139,.18);border-radius:22px;box-shadow:0 28px 80px rgba(15,70,82,.22);padding:20px}
  .ai-knowledge-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}

<script>
/* 0. THUẬT TOÁN SHA-256 THUẦN (HOẠT ĐỘNG TRÊN MỌI THIẾT BỊ / OFFLINE FILE) */
function pureSha256(ascii) {
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32 - amount)); }
  const mathPow = Math.pow;
  const maxWord = mathPow(2, 32);
  let result = '';
  const words = [];
  const asciiBitLength = ascii.length * 8;
  const hash = [];
  const k = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength | 0);

  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash.slice(0);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
      const s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
      w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      const ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
      const maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
      const s_0 = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
      const s_1 = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
      const temp1 = hash[7] + s_1 + ch + k[i] + w[i];
      const temp2 = s_0 + maj;
      hash[7] = hash[6]; hash[6] = hash[5]; hash[5] = hash[4];
      hash[4] = (hash[3] + temp1) | 0;
      hash[3] = hash[2]; hash[2] = hash[1]; hash[1] = hash[0];
      hash[0] = (temp1 + temp2) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let i2 = 3; i2 >= 0; i2--) {
      const b = (hash[i] >> (8 * i2)) & 255;
      result += ((b < 16) ? '0' : '') + b.toString(16);
    }
  }
  return result;
}

function getUserIdFromApiKey(key) {
  if (!key) return null;
  const clean = key.replace(/\s+/g, '');
  return pureSha256(clean).slice(0, 24);
}

/*
  TÀI KHOẢN FIREBASE = MỘT KHO DỮ LIỆU RIÊNG
  - Firestore lưu tại users/{firebaseAuthUid}.
  - Gemini API Key chỉ dùng để gọi Gemini, không còn quyết định danh tính tài khoản.
  - LocalStorage được namespace theo Firebase UID.
*/
let activeUid = null;

function accountStorageKey(key, uidOverride = null) {
  const uidValue = uidOverride || activeUid;
  return uidValue ? `medstudy:${uidValue}:${key}` : key;
}

function getStore(key) {
  try {
    const val = localStorage.getItem(accountStorageKey(key));
    return val ? JSON.parse(val) : null;
  } catch (e) {
    console.error('getStore error:', e);
    return null;
  }
}

function setStore(key, value) {
  try {
    localStorage.setItem(accountStorageKey(key), JSON.stringify(value));
    return true;
  } catch (e) {
    console.error('setStore error:', e);
    return false;
  }
}

function delStore(key) {
  try {
    localStorage.removeItem(accountStorageKey(key));
  } catch (e) {
    console.error('delStore error:', e);
  }
}

/* Chỉ dùng một lần để chuyển cache cũ (toc / lesson:* / attempts:*) sang API đã lưu trên máy. */
function migrateLegacyLocalCacheToAccount(uidValue) {
  if (!uidValue) return;
  const marker = `medstudy:migrated:${uidValue}`;
  if (localStorage.getItem(marker) === '1') return;

  const namespacedToc = localStorage.getItem(accountStorageKey('toc', uidValue));
  if (!namespacedToc) {
    const oldToc = localStorage.getItem('toc');
    if (oldToc) localStorage.setItem(accountStorageKey('toc', uidValue), oldToc);
  }

  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && (k.startsWith('lesson:') || k.startsWith('attempts:'))) keys.push(k);
  }
  for (const k of keys) {
    const oldVal = localStorage.getItem(k);
    const newKey = accountStorageKey(k, uidValue);
    if (oldVal !== null && localStorage.getItem(newKey) === null) {
      localStorage.setItem(newKey, oldVal);
    }
  }
  localStorage.setItem(marker, '1');
}

function migrateApiKeyAccountCacheToFirebaseUid(firebaseUid, apiKey) {
  if (!firebaseUid || !apiKey) return;
  const oldUid = getUserIdFromApiKey(apiKey);
  if (!oldUid || oldUid === firebaseUid) return;
  const marker = `medstudy:auth-migrated:${firebaseUid}:${oldUid}`;
  if (localStorage.getItem(marker) === '1') return;

  const oldPrefix = `medstudy:${oldUid}:`;
  const newPrefix = `medstudy:${firebaseUid}:`;
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(oldPrefix)) keys.push(k);
  }
  for (const oldKey of keys) {
    const suffix = oldKey.slice(oldPrefix.length);
    const newKey = newPrefix + suffix;
    if (localStorage.getItem(newKey) === null) {
      const val = localStorage.getItem(oldKey);
      if (val !== null) localStorage.setItem(newKey, val);
    }
  }
  localStorage.setItem(marker, '1');
}

function resetUiForAccountSwitch() {
  toc = { subjects: [], lessonsBySubject: {} };
  openSubjects.clear();
  currentSubjectId = null;
  currentLessonId = null;
  currentLesson = null;
  activeTab = 'mindmap';
  quiz = { index:0, answers:[], started:false, done:false, reviewMode:false, reviewQuestions:[] };
  uploadedFilesQueue = [];

  currentMmRoot = null;
}

async function syncFromCloud() {
  if (!db || !auth) { setSyncMsg('☁️ Không tải được dịch vụ đồng bộ', true); return; }
  const user = auth.currentUser;
  if (!user) { setSyncMsg('👤 Hãy đăng nhập để đồng bộ dữ liệu'); return; }

  const uidValue = user.uid;
  if (!uidValue) return;

  setSyncMsg('☁️ Đang tải kho dữ liệu...');

  try {
    activeUid = uidValue;
    resetUiForAccountSwitch();
    activeUid = uidValue;

    const doc = await db.collection('users').doc(uidValue).get();

    if (doc.exists) {
      const data = doc.data() || {};
      toc = data.toc || { subjects: [], lessonsBySubject: {} };
      setStore('toc', toc);

      if (data.lessons && typeof data.lessons === 'object') {
        for (const [k, v] of Object.entries(data.lessons)) setStore(k, v);
      }
      if (data.attempts && typeof data.attempts === 'object') {
        for (const [k, v] of Object.entries(data.attempts)) setStore(k, v);
      }

      renderSidebar();
      renderMain();
      setSyncMsg(`☁️ Đã đồng bộ (${uidValue.slice(0,6)})`);
      return;
    }

    // API hoàn toàn mới: KHÔNG lấy dữ liệu của API trước để đẩy sang.
    toc = { subjects: [], lessonsBySubject: {} };
    setStore('toc', toc);
    renderSidebar();
    renderMain();

    await db.collection('users').doc(uidValue).set({
      toc,
      lessons: {},
      attempts: {},
      createdAt: Date.now(),
      updatedAt: Date.now()
    }, { merge: true });

    setSyncMsg(`☁️ Kho dữ liệu mới (${uidValue.slice(0,6)})`);
  } catch (err) {
    console.error(err);
    setSyncMsg('☁️ Lỗi đồng bộ: ' + (err?.message || 'Không xác định'), true);
  }
}

async function syncToCloud() {
  if (!db || !auth) { setSyncMsg('☁️ Không tải được dịch vụ đồng bộ', true); return; }
  const user = auth.currentUser;
  if (!user) { setSyncMsg('👤 Hãy đăng nhập để lưu lên cloud', true); return; }

  const uidValue = user.uid;
  if (!uidValue) return;
  activeUid = uidValue;

  try {
    const payload = {
      toc: getStore('toc') || { subjects: [], lessonsBySubject: {} },
      lessons: {},
      attempts: {},
      updatedAt: Date.now()
    };

    const prefix = `medstudy:${uidValue}:`;
    for (let i = 0; i < localStorage.length; i++) {
      const storageKey = localStorage.key(i);
      if (!storageKey || !storageKey.startsWith(prefix)) continue;

      const realKey = storageKey.slice(prefix.length);
      if (realKey.startsWith('lesson:')) {
        const lData = getStore(realKey);
        if (lData) {
          // Không đẩy base64 PDF/ảnh lên Firestore để tránh vượt giới hạn document.
          payload.lessons[realKey] = {
            ...lData,
            rawPdfSources: [],
            rawSources: []
          };
        }
      } else if (realKey.startsWith('attempts:')) {
        payload.attempts[realKey] = getStore(realKey);
      }
    }

    await db.collection('users').doc(uidValue).set(payload, { merge: true });
    setSyncMsg(`☁️ Đã sao lưu (${uidValue.slice(0,6)})`);
  } catch (err) {
    console.error(err);
    setSyncMsg('☁️ Lưu thất bại: ' + (err?.message || 'Không xác định'), true);
  }
}

/* 2. LOCAL STORAGE VÀ STATE */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toNFC(str){ return String(str || '').normalize('NFC'); }

let toc = { subjects: [], lessonsBySubject: {} };
let openSubjects = new Set();
let currentSubjectId = null;
let currentLessonId = null;
let currentLesson = null;
let activeTab = 'mindmap';
let quiz = { index:0, answers:[], started:false, done:false, reviewMode:false, reviewQuestions:[] };

let uploadedFilesQueue = [];
let currentMmInstance = null;
let currentMmRoot = null;

/* LƯU TÀI LIỆU GỐC THEO TỪNG BÀI HỌC BẰNG INDEXEDDB
   - Không dùng localStorage vì PDF/ảnh có thể lớn.
   - Mỗi API Key (activeUid) + mỗi bài học có một kho tài liệu riêng trên thiết bị.
*/
const SOURCE_DB_NAME = 'MedStudyAI_SourceFiles';
const SOURCE_DB_VERSION = 1;
const SOURCE_STORE = 'lessonSources';

function openSourceDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SOURCE_DB_NAME, SOURCE_DB_VERSION);
    req.onupgradeneeded = () => {
      const dbi = req.result;
      if(!dbi.objectStoreNames.contains(SOURCE_STORE)){
        dbi.createObjectStore(SOURCE_STORE, { keyPath: 'key' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Không mở được kho tài liệu trên thiết bị.'));
  });
}

function getLessonSourceKey(lessonId = currentLessonId){
  if(!activeUid || !lessonId) return null;
  return `${activeUid}:${lessonId}`;
}

async function loadSavedLessonSources(lessonId = currentLessonId){
  const key = getLessonSourceKey(lessonId);
  if(!key) return [];
  try{
    const dbi = await openSourceDb();
    return await new Promise((resolve, reject) => {
      const tx = dbi.transaction(SOURCE_STORE, 'readonly');
      const req = tx.objectStore(SOURCE_STORE).get(key);
      req.onsuccess = () => resolve(Array.isArray(req.result?.sources) ? req.result.sources : []);
      req.onerror = () => reject(req.error);
    });
  }catch(err){
    console.error('loadSavedLessonSources error:', err);
    return [];
  }
}

async function saveLessonSources(lessonId = currentLessonId, sources = uploadedFilesQueue){
  const key = getLessonSourceKey(lessonId);
  if(!key) return false;
  try{
    const dbi = await openSourceDb();
    await new Promise((resolve, reject) => {
      const tx = dbi.transaction(SOURCE_STORE, 'readwrite');
      tx.objectStore(SOURCE_STORE).put({
        key,
        uid: activeUid,
        lessonId,
        updatedAt: Date.now(),
        sources: Array.isArray(sources) ? sources : []
      });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Không lưu được tài liệu.'));
    });
    return true;
  }catch(err){
    console.error('saveLessonSources error:', err);
    return false;
  }
}

async function deleteSavedLessonSources(lessonId){
  const key = getLessonSourceKey(lessonId);
  if(!key) return;
  try{
    const dbi = await openSourceDb();
    await new Promise((resolve, reject) => {
      const tx = dbi.transaction(SOURCE_STORE, 'readwrite');
      tx.objectStore(SOURCE_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(err){ console.error('deleteSavedLessonSources error:', err); }
}

async function init(){
  const keyInput = document.getElementById('apiKeyInput');
  const syncBtn = document.getElementById('manualSyncBtn');
  const savedKey = (localStorage.getItem('gemini_api_key') || '').replace(/\s+/g, '');

  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const authLoggedOut = document.getElementById('authLoggedOut');
  const authLoggedIn = document.getElementById('authLoggedIn');
  const authUserLine = document.getElementById('authUserLine');
  const authStatus = document.getElementById('authStatus');

  function setAuthStatus(msg, isErr=false){
    if(!authStatus) return;
    authStatus.textContent = msg || '';
    authStatus.style.color = isErr ? 'var(--wrong)' : 'var(--muted)';
  }

  function friendlyAuthError(err){
    const code = err?.code || '';
    if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Email hoặc mật khẩu không đúng.';
    if(code.includes('email-already-in-use')) return 'Email này đã được đăng ký.';
    if(code.includes('weak-password')) return 'Mật khẩu cần ít nhất 6 ký tự.';
    if(code.includes('invalid-email')) return 'Email không hợp lệ.';
    if(code.includes('too-many-requests')) return 'Thử đăng nhập quá nhiều lần. Vui lòng thử lại sau.';
    if(code.includes('network-request-failed')) return 'Không kết nối được Firebase. Hãy kiểm tra mạng.';
    return err?.message || 'Không xác định';
  }

  async function triggerSync() {
    const key = keyInput.value.replace(/\s+/g, '');
    keyInput.value = key;
    if (!key) {
      alert('Vui lòng nhập Google Gemini API Key trước!');
      return;
    }
    localStorage.setItem('gemini_api_key', key);
    if (!auth?.currentUser) {
      setSyncMsg('👤 Hãy đăng nhập tài khoản MedStudy AI trước', true);
      return;
    }
    migrateApiKeyAccountCacheToFirebaseUid(auth.currentUser.uid, key);
    await syncFromCloud();
  }

  if (savedKey) keyInput.value = savedKey;

  loginBtn?.addEventListener('click', async () => {
    try{
      setAuthStatus('Đang đăng nhập...');
      await auth.signInWithEmailAndPassword((authEmail.value||'').trim(), authPassword.value||'');
    }catch(err){ setAuthStatus(friendlyAuthError(err), true); }
  });

  registerBtn?.addEventListener('click', async () => {
    try{
      const email=(authEmail.value||'').trim();
      const password=authPassword.value||'';
      if(!email || !password){ setAuthStatus('Vui lòng nhập email và mật khẩu.', true); return; }
      setAuthStatus('Đang tạo tài khoản...');
      await auth.createUserWithEmailAndPassword(email, password);
    }catch(err){ setAuthStatus(friendlyAuthError(err), true); }
  });

  logoutBtn?.addEventListener('click', async () => {
    try{ await auth.signOut(); }catch(err){ setAuthStatus(friendlyAuthError(err), true); }
  });

  auth?.onAuthStateChanged(async user => {
    if(user){
      activeUid = user.uid;
      authLoggedOut.style.display='none';
      authLoggedIn.style.display='block';
      authUserLine.textContent = `✅ ${user.email || 'Đã đăng nhập'}`;
      setAuthStatus('Dữ liệu được gắn với tài khoản này.');
      if(savedKey) migrateApiKeyAccountCacheToFirebaseUid(user.uid, savedKey);
      await syncFromCloud();
    }else{
      activeUid = null;
      authLoggedOut.style.display='block';
      authLoggedIn.style.display='none';
      authUserLine.textContent='';
      resetUiForAccountSwitch();
      renderSidebar();
      renderMain();
      setAuthStatus('Đăng nhập để đồng bộ dữ liệu giữa các thiết bị.');
      setSyncMsg('👤 Chưa đăng nhập');
    }
  });

  keyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') triggerSync();
  });
  keyInput.addEventListener('change', () => {
    const key = keyInput.value.replace(/\s+/g, '');
    keyInput.value = key;
    if(key) localStorage.setItem('gemini_api_key', key);
  });
  if(syncBtn) syncBtn.addEventListener('click', triggerSync);
}
init();

function addLesson(subjectId, inputEl){
  const name = toNFC(inputEl.value.trim());
  if(!name) return;
  const id = uid();
  if(!toc.lessonsBySubject[subjectId]) toc.lessonsBySubject[subjectId] = [];
  toc.lessonsBySubject[subjectId].push({ id, name, createdAt: Date.now() });
  setStore('toc', toc);
  syncToCloud();
  inputEl.value = '';
  currentSubjectId = subjectId;
  currentLessonId = id;
  currentLesson = null;
  uploadedFilesQueue = [];
  activeTab = 'mindmap';
  renderSidebar(); renderMain();
}

  const pdfInput = wrap.querySelector('#pdfInput');
  const dropArea = wrap.querySelector('#dropArea');

  const queueEl = wrap.querySelector('#fileQueue');

  const status = wrap.querySelector('#genStatus');
  const sourceSaveHint = wrap.querySelector('#sourceSaveHint');

  function renderQueueList(){
    queueEl.innerHTML = '';
    if(uploadedFilesQueue.length > 0){
      uploadedFilesQueue.forEach((fileObj, idx) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        const info = document.createElement('span');

        const strong = document.createElement('strong');

        const del = document.createElement('span');
        del.className = 'chip-del'; del.title = 'Xoá file này'; del.textContent = '✕';
        chip.append(info, del);
        del.addEventListener('click', async () => {
          uploadedFilesQueue.splice(idx, 1);
          await saveLessonSources(currentLessonId, uploadedFilesQueue);
          renderQueueList();
        });

      });
      const pdfCount = uploadedFilesQueue.filter(f => f.mimeType === 'application/pdf').length;
      const imageCount = uploadedFilesQueue.length - pdfCount;
      status.textContent = toNFC(`Đã sẵn sàng: ${pdfCount} PDF${imageCount ? ` + ${imageCount} ảnh` : ''}.`);
      status.style.color = 'var(--correct)';
      if(sourceSaveHint) sourceSaveHint.style.display = 'block';
    } else {
      status.textContent = '';
      if(sourceSaveHint) sourceSaveHint.style.display = 'none';
    }
  }

  async function processFiles(filesList){
    const MAX_FILE_SIZE = 20 * 1024 * 1024;
    const MAX_FILES = 10;
    const supported = new Set(['application/pdf','image/jpeg','image/png','image/webp','image/heic','image/heif']);
    const candidates = Array.from(filesList).filter(f => {
      const n = f.name.toLowerCase();
      return supported.has(f.type) || /\.(pdf|jpe?g|png|webp|heic|heif)$/.test(n);
    });
    const validFiles = candidates.filter(f => f.size <= MAX_FILE_SIZE).slice(0, Math.max(0, MAX_FILES - uploadedFilesQueue.length));
    if(validFiles.length === 0){
      alert("Không có tài liệu hợp lệ. Hỗ trợ PDF, JPG/JPEG, PNG, WEBP, HEIC/HEIF; tối đa 10 file, mỗi file ≤ 20 MB.");
      return;
    }
    status.innerHTML = `<span class="loader"><span class="spinner"></span> Đang nạp ${validFiles.length} tài liệu...</span>`;

    for (const file of validFiles) {
      if(!uploadedFilesQueue.some(item => item.name === file.name && item.size === file.size)){
        await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const dataUrl = String(e.target.result || '');
            let mimeType = file.type || '';
            if(!mimeType){
              const n=file.name.toLowerCase();
              mimeType = n.endsWith('.pdf') ? 'application/pdf' : n.endsWith('.png') ? 'image/png' : n.endsWith('.webp') ? 'image/webp' : n.endsWith('.heic') ? 'image/heic' : n.endsWith('.heif') ? 'image/heif' : 'image/jpeg';
            }
            uploadedFilesQueue.push({ name:file.name, size:file.size, mimeType, base64:dataUrl.split(',')[1] });
            resolve();
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
    }
    await saveLessonSources(currentLessonId, uploadedFilesQueue);
    renderQueueList();
  }

  // Không gắn click cho toàn bộ dropArea vì bên trong có các nút riêng, tránh mở hộp chọn file 2 lần trên mobile.
  pickFilesBtn.addEventListener('click', (e) => { e.stopPropagation(); pdfInput.click(); });
  cameraBtn.addEventListener('click', (e) => { e.stopPropagation(); cameraInput.click(); });
  pdfInput.addEventListener('change', (e) => { if(e.target.files.length) processFiles(e.target.files); e.target.value=''; });
  cameraInput.addEventListener('change', (e) => { if(e.target.files.length) processFiles(e.target.files); e.target.value=''; });

  ['dragenter', 'dragover'].forEach(name => {
    dropArea.addEventListener(name, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropArea.classList.add('dragover');
    }, false);
  });
  ['dragleave', 'drop'].forEach(name => {
    dropArea.addEventListener(name, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropArea.classList.remove('dragover');
    }, false);
  });
  dropArea.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    if(dt && dt.files.length){ processFiles(dt.files); }
  }, false);

  // Tự nạp lại tài liệu đã lưu của bài học hiện tại mỗi khi mở màn hình tạo.
  (async () => {
    const saved = await loadSavedLessonSources(currentLessonId);
    uploadedFilesQueue = Array.isArray(saved) ? saved : [];
    const existingLesson = getStore('lesson:' + currentLessonId);
    if(existingLesson?.rawNoteText && !textarea.value){
      textarea.value = existingLesson.rawNoteText;
    }
    renderQueueList();
  })();

  wrap.querySelector('#genBtn').addEventListener('click', () => generateLessonWithGemini(wrap));
  return wrap;
}

/* 5. GỌI GEMINI 2.5-FLASH TẠO SƠ ĐỒ VÀ TRẮC NGHIỆM */
async function generateLessonWithGemini(wrap){
  const apiKey = (document.getElementById('apiKeyInput').value || '').replace(/\s+/g, '');
  const textarea = wrap.querySelector('#contentInput');
  const status = wrap.querySelector('#genStatus');
  const btn = wrap.querySelector('#genBtn');
  const manualText = textarea.value.trim();

  const numQuestions = parseInt(document.getElementById('quizCountSelect')?.value || '15', 10);
  const quizLevel = document.getElementById('quizLevelSelect')?.value || 'standard';

  if(!apiKey){
    alert("Vui lòng dán Google Gemini API Key ở khung bên trái trước.");
    return;
  }
  
  if(uploadedFilesQueue.length === 0 && manualText.length < 50){
    status.textContent = 'Vui lòng nạp ít nhất một tài liệu PDF/ảnh hoặc dán nội dung giáo trình.';
    status.style.color = 'var(--wrong)';
    return;
  }

  await saveLessonSources(currentLessonId, uploadedFilesQueue);

  btn.disabled = true;
  status.style.color = 'var(--muted)';
  status.innerHTML = `<span class="loader"><span class="spinner"></span> AI đang phân tích tài liệu và dựng ngân hàng ${numQuestions} câu trắc nghiệm...</span>`;

  let levelInstruction = "Câu hỏi bao quát toàn diện các kiến thức trọng tâm, định luật, công thức và thông số kỹ thuật.";
  if(quizLevel === 'hard'){
    levelInstruction = "Tập trung vào các câu hỏi phân biệt chi tiết dễ nhầm lẫn, các bẫy trắc nghiệm lý thuyết và câu hỏi suy luận so sánh.";
  } else if(quizLevel === 'clinical'){
    levelInstruction = "Tập trung vào tình huống thực hành, ứng dụng xử lý kết quả đo lường, ca định lượng/định tính thực tế trong phòng kiểm nghiệm/dược lâm sàng.";
  }

  const promptText = `Bạn là chuyên gia thiết kế bản đồ tư duy và ngân hàng đề thi Y Dược học chuyên sâu.
Nhiệm vụ: Đọc kỹ tài liệu và trả về DUY NHẤT một đối tượng JSON hợp lệ (không dùng backtick \`\`\`json, không lời dẫn ngoài).

CẤU TRÚC BẮT BUỘC:
{
  "mindmapMarkdown": "# Tên chủ đề chính\\n## 1. Nhánh lớn 1\\n### Nhánh con 1.1\\n- Ý chi tiết 1\\n- Ý chi tiết 2\\n### Nhánh con 1.2\\n- Ý chi tiết 1\\n- Ý chi tiết 2\\n## 2. Nhánh lớn 2\\n### Nhánh con 2.1\\n- Ý chi tiết 1\\n- Ý chi tiết 2",
  "questions": [
    {
      "question": "Nội dung câu hỏi trắc nghiệm?",
      "options": ["Phương án A", "Phương án B", "Phương án C", "Phương án D"],
      "correctIndex": 0,
      "explanation": "Giải thích chi tiết tại sao đúng và tại sao các phương án khác sai"
    }
  ]
}

YÊU CẦU:
1. SƠ ĐỒ TƯ DUY: Phân cấp rõ ràng bằng Markdown (#, ##, ###, -), súc tích, dễ nhớ.
2. TRẮC NGHIỆM:
- Soạn ĐÚNG CHÍNH XÁC ${numQuestions} câu hỏi trắc nghiệm mới, đa dạng góc nhìn, KHÔNG trùng lặp.
- Định hướng đề thi: ${levelInstruction}
- Mã ngẫu nhiên phiên làm việc: ${Date.now()}`;

  let parts = [{ text: promptText }];
  if(uploadedFilesQueue.length > 0){
    uploadedFilesQueue.forEach(f => {
      parts.push({
        inlineData: {
          mimeType: f.mimeType || 'application/pdf',
          data: f.base64
        }
      });
    });
  }
  if(manualText){
    parts.push({ text: "GHI CHÚ BỔ SUNG:\n" + manualText });
  }

  try{
    // Use a current Gemini model for the initial PDF/image generation path.
    // The old path still used gemini-2.5-flash, which can return 404 for newer projects.
    const GEMINI_MODEL = 'gemini-3.6-flash';
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify({
        contents: [{ parts: parts }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.85
        }
      })
    });

    if (!response.ok) {
      let detail = '';
      try {
        const errJson = await response.json();
        detail = errJson?.error?.message || '';
      } catch (_) {
        try { detail = await response.text(); } catch (_) {}
      }
      throw new Error(`Gemini HTTP ${response.status}${detail ? ': ' + detail : ''}`);
    }

    const data = await response.json();
    const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!generatedText) throw new Error("Không nhận được phản hồi từ Gemini.");

    let clean = generatedText.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);

    if(typeof parsed.mindmapMarkdown !== 'string' || !Array.isArray(parsed.questions)){
      throw new Error('Gemini trả về dữ liệu không đúng cấu trúc yêu cầu.');
    }
    parsed.questions = parsed.questions.filter(q =>
      q && typeof q.question === 'string' && Array.isArray(q.options) && q.options.length === 4 &&
      Number.isInteger(q.correctIndex) && q.correctIndex >= 0 && q.correctIndex < 4
    );

    const lessonMeta = (toc.lessonsBySubject[currentSubjectId] || []).find(l => l.id === currentLessonId);
    const lessonObj = {
      subjectId: currentSubjectId,
      name: toNFC(lessonMeta ? lessonMeta.name : ''),
      mindmapMarkdown: toNFC(parsed.mindmapMarkdown),
      questions: (parsed.questions || []).map(q => ({
        id: uid(),
        question: toNFC(q.question),
        options: q.options.map(opt => toNFC(opt)),
        correctIndex: q.correctIndex,
        explanation: toNFC(q.explanation)
      })),
      rawPdfSources: uploadedFilesQueue.map(f => ({ name: f.name, size: f.size, mimeType: f.mimeType || 'application/pdf' })),
      rawSources: uploadedFilesQueue.map(f => ({ name: f.name, size: f.size, mimeType: f.mimeType || 'application/pdf' })),
      sourceCount: uploadedFilesQueue.length,
      rawNoteText: manualText,
      createdAt: Date.now()
    };
    setStore('lesson:'+currentLessonId, lessonObj);
    currentLesson = lessonObj;
    await syncToCloud();
    renderMain();
  }catch(err){
    console.error(err);
    status.style.color = 'var(--wrong)';
    status.textContent = 'Lỗi: ' + (err.message || 'Không thể tạo nội dung. Vui lòng kiểm tra lại mã API Key.');
    btn.disabled = false;
  }
}

/* 6. TẠO LẠI BỘ TRẮC NGHIỆM RIÊNG (TỐI ƯU NHẸ DỰA TRÊN MIND MAP) */
async function regenerateOnlyQuiz(count, level){
  const apiKey = (document.getElementById('apiKeyInput')?.value || '').replace(/\s+/g, '');
  if(!apiKey){
    alert("Vui lòng kiểm tra mã Gemini API Key!");
    return;
  }
  if(!currentLesson) return;

  const statusEl = document.getElementById('quizRegenStatus');
  const regenBtn = document.getElementById('regenQuizBtn');
  if(regenBtn) regenBtn.disabled = true;

  const setQuizStatus = (html, isError = false) => {
    const el = document.getElementById('quizRegenStatus') || statusEl;
    if(!el) return;
    el.style.color = isError ? 'var(--wrong)' : 'var(--muted)';
    el.innerHTML = html;
  };

  setQuizStatus(`<span class="loader"><span class="spinner"></span> Đang tạo ${count} câu</span>`);

  let levelInstruction = "Bao quát các kiến thức trọng tâm, định luật, công thức và thông số kỹ thuật.";
  if(level === 'hard'){
    levelInstruction = "Tập trung vào chi tiết dễ nhầm lẫn, bẫy trắc nghiệm và câu hỏi suy luận so sánh.";
  } else if(level === 'clinical'){
    levelInstruction = "Tập trung vào tình huống thực hành, ứng dụng và ca lâm sàng/thực tế phù hợp với nội dung bài học.";
  }

  const sourceText = String(currentLesson.mindmapMarkdown || currentLesson.name || '').slice(0, 50000);
  const noteText = String(currentLesson.rawNoteText || '').slice(0, 15000);

  const promptText = `Bạn là chuyên gia soạn đề thi Y Dược.
Hãy tạo MỘT BỘ TRẮC NGHIỆM MỚI dựa CHỈ trên nội dung bài học dưới đây.
Không lặp lại câu hỏi cũ, không đưa thông tin ngoài tài liệu nếu tài liệu không hỗ trợ.

NỘI DUNG BÀI HỌC:
${sourceText}${noteText ? '\n\nGHI CHÚ BỔ SUNG:\n' + noteText : ''}

YÊU CẦU:
- Tạo đúng ${count} câu hỏi.
- Mỗi câu có đúng 4 phương án.
- correctIndex là số nguyên 0, 1, 2 hoặc 3.
- ${levelInstruction}
- Giải thích ngắn gọn, rõ ràng, tối đa 2-3 câu cho mỗi câu hỏi.
- Chỉ trả về JSON hợp lệ theo dạng:
{"questions":[{"question":"...","options":["A","B","C","D"],"correctIndex":0,"explanation":"..."}]}`;

  async function requestGemini(model){
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: promptText }] }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.6,
          maxOutputTokens: 32768
        }
      })
    });

    let data = {};
    try { data = await response.json(); } catch (_) {}
    if(!response.ok){
      const message = data?.error?.message || `HTTP ${response.status}`;
      const err = new Error(message);
      err.httpStatus = response.status;
      err.model = model;
      throw err;
    }
    return {data, model};
  }

  try {
    // Gemini 2.5 hiện có thể bị giới hạn trên một số project/key mới.
    // Ưu tiên model mới, tự động fallback nếu model đầu không khả dụng.
    const models = ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-2.5-flash'];
    let result = null;
    let lastErr = null;

    for(const model of models){
      try {
        setQuizStatus(`<span class="loader"><span class="spinner"></span> Đang tạo ${count} câu</span>`);
        result = await requestGemini(model);
        break;
      } catch(err){
        lastErr = err;
        console.warn(`Gemini ${model} failed:`, err);
        // 400 có thể là lỗi request thật; nhưng vẫn thử model tiếp theo vì mỗi model có khác biệt nhỏ.
        if(![400,401,403,404,405,429,500,503].includes(err.httpStatus)) break;
      }
    }

    if(!result) throw lastErr || new Error('Không gọi được Gemini API.');

    const candidate = result.data?.candidates?.[0];
    const finishReason = candidate?.finishReason || '';
    const generatedText = candidate?.content?.parts?.map(p => p.text || '').join('') || '';

    if(!generatedText){
      throw new Error(`Gemini không trả về nội dung${finishReason ? ` (${finishReason})` : ''}.`);
    }
    if(finishReason === 'MAX_TOKENS'){
      throw new Error('Phản hồi bị cắt do quá dài. Hãy thử giảm số câu xuống 20 câu.');
    }

    let clean = generatedText.trim()
      .replace(/^```json\s*/i, '')
      .replace(/^```\s*/i, '')
      .replace(/```\s*$/i, '')
      .trim();

    // Nếu model lỡ thêm chữ trước/sau JSON, lấy phần object ngoài cùng.
    const firstBrace = clean.indexOf('{');
    const lastBrace = clean.lastIndexOf('}');
    if(firstBrace >= 0 && lastBrace > firstBrace){
      clean = clean.slice(firstBrace, lastBrace + 1);
    }

    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch(parseErr){
      console.error('Gemini raw response:', generatedText);
      throw new Error('Gemini trả về JSON chưa hoàn chỉnh. Hãy thử tạo 20 câu hoặc bấm tạo lại.');
    }

    if(!Array.isArray(parsed.questions)){
      throw new Error('Gemini trả về dữ liệu không đúng cấu trúc câu hỏi.');
    }

    const cleanQuestions = parsed.questions
      .filter(q =>
        q && typeof q.question === 'string' &&
        Array.isArray(q.options) && q.options.length === 4 &&
        Number.isInteger(q.correctIndex) && q.correctIndex >= 0 && q.correctIndex < 4
      )
      .slice(0, count);

    if(cleanQuestions.length === 0){
      throw new Error('Không nhận được câu hỏi hợp lệ từ Gemini.');
    }

    currentLesson.questions = cleanQuestions.map(q => ({
      id: uid(),
      question: toNFC(q.question),
      options: q.options.map(opt => toNFC(opt)),
      correctIndex: q.correctIndex,
      explanation: toNFC(q.explanation || '')
    }));

    setStore('lesson:' + currentLessonId, currentLesson);
    await syncToCloud();

    quiz = { index:0, answers:[], started:false, done:false, reviewMode:false, reviewQuestions:[] };
    renderMain();
  } catch(err) {
    console.error('regenerateOnlyQuiz error:', err);
    const code = err?.httpStatus ? `HTTP ${err.httpStatus}: ` : '';
    setQuizStatus(`❌ ${code}${toNFC(err.message || 'Không thể tạo mới câu hỏi.')}`, true);
  } finally {
    const currentBtn = document.getElementById('regenQuizBtn');
    if(currentBtn) currentBtn.disabled = false;
  }
}

        <button type="button" data-prompt="Cho ví dụ minh họa thực tế hoặc ví dụ dễ nhớ cho nội dung này.">Ví dụ dễ nhớ</button>

        <button type="button" data-prompt="Nêu những điểm dễ nhầm lẫn và cách phân biệt liên quan đến nội dung này.">Điểm dễ nhầm</button>
      </div>
      <div class="ai-saved-bar">
        <button class="ai-history-toggle" id="aiKnowledgeHistoryToggle" type="button">🕘 Xem lại <span id="aiKnowledgeHistoryCount">0</span> lần hỏi</button>
        <button class="ai-history-clear" id="aiKnowledgeHistoryClear" type="button">Xóa lịch sử</button>
      </div>

      <div class="ai-actions">

      <div class="ai-answer" id="aiKnowledgeAnswer"></div>
      <div class="ai-note">AI ưu tiên bám theo nội dung bài học. Kiến thức bổ sung ngoài tài liệu sẽ được ghi rõ là “Bổ sung”.</div>
    </div>`;
  document.body.appendChild(modal);

  const close = () => modal.classList.remove('open');
  modal.querySelector('#aiKnowledgeClose').addEventListener('click', close);
  modal.addEventListener('click', (e) => { if(e.target === modal) close(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modal.classList.contains('open')) close(); });

  modal.querySelectorAll('.ai-quick-prompts button').forEach(btn => {
    btn.addEventListener('click', () => {
      modal.querySelector('#aiKnowledgeQuestion').value = btn.dataset.prompt || '';
      modal.querySelector('#aiKnowledgeQuestion').focus();
    });
  });

  modal.querySelector('#aiKnowledgeClear').addEventListener('click', () => {
    modal.querySelector('#aiKnowledgeQuestion').value = '';
    const ans = modal.querySelector('#aiKnowledgeAnswer');
    ans.textContent = '';
    ans.classList.remove('show');

  modal.querySelector('#aiKnowledgeHistoryToggle').addEventListener('click', () => {
    const box = modal.querySelector('#aiKnowledgeHistory');
    box.classList.toggle('show');
  });

  modal.querySelector('#aiKnowledgeHistoryClear').addEventListener('click', () => {
    const topic = String(modal.dataset.topic || '').trim();
    if(!topic) return;
    if(!confirm('Xóa toàn bộ phần Hỏi AI đã lưu cho nội dung này?')) return;
    const all = getAiKnowledgeStore().filter(item => item.topic !== topic);
    setAiKnowledgeStore(all);
    renderAiKnowledgeHistory(modal, topic);

    ans.textContent = '';
    ans.classList.remove('show');
  });

  modal.querySelector('#aiKnowledgeAsk').addEventListener('click', askAiKnowledge);
