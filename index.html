function aiKnowledgeStorageKey(){
  return `aiKnowledge:${currentLessonId || 'none'}`;
}

function getAiKnowledgeStore(){
  const data = getStore(aiKnowledgeStorageKey());
  return Array.isArray(data) ? data : [];
}

function setAiKnowledgeStore(items){
  const safe = Array.isArray(items) ? items.slice(-40) : [];
  setStore(aiKnowledgeStorageKey(), safe);
}

function saveAiKnowledgeEntry(topic, question, answer){
  const items = getAiKnowledgeStore();
  items.push({
    id: uid(),
    topic: String(topic || '').trim(),
    question: String(question || '').trim(),
    answer: String(answer || '').trim().slice(0, 18000),
    createdAt: Date.now()
  });
  setAiKnowledgeStore(items);
}

function renderAiKnowledgeHistory(modal, topic){
  const list = getAiKnowledgeStore().filter(item => item.topic === topic).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  modal.querySelector('#aiKnowledgeHistoryCount').textContent = String(list.length);
  const box = modal.querySelector('#aiKnowledgeHistory');
  box.innerHTML = '';
  if(list.length === 0){
    box.innerHTML = '<div class="ai-history-empty">Chưa có nội dung AI nào được lưu cho mục này.</div>';
    return list;
  }
  list.forEach(item => {
    const row = document.createElement('div');
    row.className = 'ai-history-item';
    const meta = document.createElement('div');
    meta.className = 'ai-history-meta';
    const q = document.createElement('div');
    q.className = 'ai-history-question';
    q.textContent = toNFC(item.question || 'Câu hỏi AI');
    const time = document.createElement('div');
    time.className = 'ai-history-time';
    time.textContent = new Date(item.createdAt || Date.now()).toLocaleString('vi-VN', {timeZone:'Asia/Ho_Chi_Minh',hour12:false});
    meta.append(q,time);
    const actions = document.createElement('div');
    actions.className = 'ai-history-actions';
    const view = document.createElement('button');
    view.type = 'button'; view.textContent = 'Xem';
    view.addEventListener('click', () => {
      modal.querySelector('#aiKnowledgeQuestion').value = item.question || '';
      const ans = modal.querySelector('#aiKnowledgeAnswer');
      ans.classList.add('show');
      renderAiKnowledgeAnswer(ans, item.answer || '');
      box.classList.remove('show');
    });
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '✕'; del.className = 'delete';
    del.title = 'Xóa lần hỏi này';
    del.addEventListener('click', () => {
      setAiKnowledgeStore(getAiKnowledgeStore().filter(x => x.id !== item.id));
      renderAiKnowledgeHistory(modal, topic);
    });
    actions.append(view,del);
    row.append(meta,actions);
    box.appendChild(row);
  });
  return list;
}

function openAiKnowledge(topic){
  const modal = ensureAiKnowledgeModal();
  modal.dataset.topic = String(topic || '').trim();
  modal.querySelector('#aiKnowledgeTopic').textContent = toNFC(modal.dataset.topic || 'Nội dung đang chọn');
  const q = modal.querySelector('#aiKnowledgeQuestion');
  q.value = 'Giải thích rõ hơn nội dung này theo cách dễ hiểu, súc tích.';
  const ans = modal.querySelector('#aiKnowledgeAnswer');
  ans.textContent = '';
  ans.classList.remove('show');
  const historyBox = modal.querySelector('#aiKnowledgeHistory');
  historyBox.classList.remove('show');
  const saved = renderAiKnowledgeHistory(modal, modal.dataset.topic);
  if(saved.length > 0){
    q.value = saved[0].question || q.value;
    ans.classList.add('show');
    renderAiKnowledgeAnswer(ans, saved[0].answer || '');
  }
  modal.classList.add('open');
  setTimeout(() => q.focus(), 30);
}

function normalizeAiLatex(raw){
  let text = String(raw || '').replace(/\r\n/g, '\n');

  // Chuẩn hóa một số ký hiệu Gemini hay xuất không thống nhất.
  text = text.replace(/E_\{1\\text\{cm\}\}\^\{1%\}/g, 'E_{1\\text{cm}}^{1\\%}');
  text = text.replace(/E_\{1cm\}\^\{1%\}/g, 'E_{1\\mathrm{cm}}^{1\\%}');

  const escapePercentInMath = (s) => String(s || '').replace(/(^|[^\\])%/g, '$1\\%');

  // 1) Bảo vệ và sửa các công thức đã có delimiter.
  text = text.replace(/\$\$([\s\S]*?)\$\$/g, (m, inner) => '$$' + escapePercentInMath(inner) + '$$');
  text = text.replace(/\$([^\n$]+?)\$/g, (m, inner) => '$' + escapePercentInMath(inner) + '$');
  text = text.replace(/\\\[([\s\S]*?)\\\]/g, (m, inner) => '\\[' + escapePercentInMath(inner) + '\\]');
  text = text.replace(/\\\(([^\n]*?)\\\)/g, (m, inner) => '\\(' + escapePercentInMath(inner) + '\\)');

  // 2) Bọc công thức đứng riêng một dòng. Chỉ cần có dấu = và dấu hiệu TeX.
  //    Không dùng phép kiểm tra "mostlyMath" quá chặt vì \text{cm}, tiếng Việt trong \text{}...
  text = text.split('\n').map(line => {
    const t = line.trim();
    if(!t || t.includes('$') || t.startsWith('```')) return line;
    const hasTex = /\\[A-Za-z]+|_\{|\^\{/.test(t);
    const looksEquation = /[=≈<>≤≥]/.test(t);
    if(hasTex && looksEquation && !/^#{1,6}\s/.test(t) && !/^[-*+]\s/.test(t)){
      return line.replace(t, '$$' + escapePercentInMath(t) + '$$');
    }
    return line;
  }).join('\n');

  // 3) Bọc các biểu thức E_{...}^{...} bị Gemini để trần trong tiêu đề/câu văn.
  //    Hỗ trợ cả E_{1\\text{cm}}^{1%}, E_{1cm}^{1%}, E_{1\\mathrm{cm}}^{1%}.
  const protectedParts = text.split(/(\$\$[\s\S]*?\$\$|\$[^\n$]+\$|\\\[[\s\S]*?\\\]|\\\([^\n]*?\\\))/g);
  for(let i=0; i<protectedParts.length; i+=2){
    let part = protectedParts[i];

    part = part.replace(/E_\{((?:\\(?:text|mathrm)\{[^}]*\}|[^}])+)\}\^\{([^}]*)\}/g,
      (m, sub, sup) => '$E_{' + sub + '}^{' + escapePercentInMath(sup) + '}$');

    // 4) Các token TeX ngắn khác còn trần: \varepsilon, \epsilon, \cdot... trong đoạn văn.
    //    Chỉ bọc token đơn để tránh nuốt cả câu.
    part = part.replace(/(?<![$\\])\\(varepsilon|epsilon|alpha|beta|gamma|lambda|mu|sigma|Delta)(?![A-Za-z])/g,
      (m) => '$' + m + '$');

    protectedParts[i] = part;
  }
  return protectedParts.join('');
}

function latexToReadable(tex){
  let s = String(tex || '');
  // Các ký hiệu thường gặp trong Y Dược / UV-Vis.
  s = s.replace(/E_\{1\\(?:text|mathrm)\{cm\}\}\^\{1\\?%\}/g, 'E(1%, 1 cm)');
  s = s.replace(/E_\{1cm\}\^\{1\\?%\}/g, 'E(1%, 1 cm)');
  s = s.replace(/\\varepsilon|\\epsilon/g, 'ε')
       .replace(/\\alpha/g, 'α').replace(/\\beta/g, 'β')
       .replace(/\\gamma/g, 'γ').replace(/\\lambda/g, 'λ')
       .replace(/\\mu/g, 'μ').replace(/\\sigma/g, 'σ')
       .replace(/\\Delta/g, 'Δ')
       .replace(/\\cdot/g, '·').replace(/\\times/g, '×')
       .replace(/\\pm/g, '±').replace(/\\leq/g, '≤').replace(/\\geq/g, '≥')
       .replace(/\\%/g, '%');
  // Phân số đơn giản: \frac{a}{b} -> (a)/(b)
  for(let i=0;i<4;i++){
    s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');
  }
  s = s.replace(/\\(?:text|mathrm|operatorname)\{([^{}]*)\}/g, '$1');
  // Chỉ số trên/dưới còn sót lại được đổi sang dạng dễ đọc thay vì lộ mã LaTeX.
  s = s.replace(/_\{([^{}]+)\}/g, '₍$1₎').replace(/\^\{([^{}]+)\}/g, '^($1)');
  s = s.replace(/\\left|\\right/g, '').replace(/[{}]/g, '').replace(/\\([A-Za-z]+)/g, '$1');
  return s.trim();
}

function renderAiKnowledgeAnswer(target, rawText){
  const text = normalizeAiLatex(toNFC(String(rawText || '')).trim());
  if(!text){ target.textContent = ''; return; }

  try{
    // Tách công thức RA KHỎI Markdown trước khi parse. Điều này ngăn marked làm mất
    // backslash, %, dấu ngoặc... trong LaTeX.
    const mathItems = [];
    const tokenized = text.replace(/\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\]|\$([^\n$]+?)\$|\\\(([^\n]*?)\\\)/g,
      (m, dd, br, inlineDollar, inlineParen) => {
        const display = dd !== undefined || br !== undefined;
        const tex = dd ?? br ?? inlineDollar ?? inlineParen ?? '';
        const id = mathItems.length;
        mathItems.push({tex, display});
        return `@@MEDSTUDY_MATH_${id}@@`;
      }
    );

    let html;
    if(window.marked && typeof window.marked.parse === 'function'){
      html = window.marked.parse(tokenized, { gfm:true, breaks:true });
    }else{
      const esc = tokenized.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      html = esc.replace(/\n/g, '<br>');
    }

    if(window.DOMPurify){
      html = window.DOMPurify.sanitize(html, {USE_PROFILES:{html:true}});
    }
    target.innerHTML = html;

    // Khôi phục từng token và render trực tiếp bằng KaTeX.
    const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    const tokenRe = /@@MEDSTUDY_MATH_(\d+)@@/g;

    nodes.forEach(node => {
      const val = node.nodeValue || '';
      if(!val.includes('@@MEDSTUDY_MATH_')) return;
      const frag = document.createDocumentFragment();
      let last = 0, match;
      tokenRe.lastIndex = 0;
      while((match = tokenRe.exec(val))){
        if(match.index > last) frag.appendChild(document.createTextNode(val.slice(last, match.index)));
        const item = mathItems[Number(match[1])];
        const span = document.createElement(item?.display ? 'div' : 'span');
        span.className = item?.display ? 'math-display-safe' : 'math-inline-safe';
        if(item){
          try{
            if(window.katex && typeof window.katex.render === 'function'){
              window.katex.render(item.tex, span, {
                displayMode: !!item.display,
                throwOnError: true,
                strict: false,
                trust: false
              });
            }else{
              span.textContent = latexToReadable(item.tex);
            }
          }catch(e){
            // Nếu công thức AI bị malformed, luôn hiển thị bản dễ đọc thay vì mã LaTeX đỏ.
            span.textContent = latexToReadable(item.tex);
            span.classList.add('math-fallback-readable');
          }
        }
        frag.appendChild(span);
        last = tokenRe.lastIndex;
      }
      if(last < val.length) frag.appendChild(document.createTextNode(val.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });

    // Lớp cứu hộ cuối: nếu Gemini để LaTeX trần không delimiter, đổi sang chữ dễ đọc.
    const rescue = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
    const rescueNodes = [];
    while(rescue.nextNode()) rescueNodes.push(rescue.currentNode);
    rescueNodes.forEach(node => {
      const parent = node.parentElement;
      if(!parent || parent.closest('.katex, code, pre')) return;
      const v = node.nodeValue || '';
      if(/\\(?:frac|text|mathrm|varepsilon|epsilon|cdot|times)|E_\{|\^\{|_\{/.test(v)){
        node.nodeValue = latexToReadable(v);
      }
    });
  }catch(err){
    console.warn('Không thể render Markdown/LaTeX:', err);
    target.textContent = latexToReadable(text);
  }
}

async function askAiKnowledge(){
  const modal = ensureAiKnowledgeModal();
  const apiKey = (document.getElementById('apiKeyInput')?.value || '').replace(/\s+/g, '');
  if(!apiKey){ alert('Vui lòng nhập Gemini API Key trước.'); return; }

  const topic = String(modal.dataset.topic || '').trim();
  const question = modal.querySelector('#aiKnowledgeQuestion').value.trim();
  if(!question){ alert('Vui lòng nhập câu hỏi.'); return; }

  const askBtn = modal.querySelector('#aiKnowledgeAsk');
  const answerEl = modal.querySelector('#aiKnowledgeAnswer');
  askBtn.disabled = true;
  answerEl.classList.add('show');
  answerEl.innerHTML = '<span class="loader"><span class="spinner"></span> AI đang trả lời...</span>';

  const lessonContext = String(currentLesson?.mindmapMarkdown || currentLesson?.name || '').slice(0, 22000);
  const noteContext = String(currentLesson?.rawNoteText || '').slice(0, 6000);
  const prompt = `Bạn là trợ lý học tập Y Dược. Hãy trả lời bằng tiếng Việt, rõ ràng, chính xác, dễ học.

CHỦ ĐỀ NGƯỜI HỌC ĐANG CHỌN:
${topic}

CÂU HỎI:
${question}

NGỮ CẢNH BÀI HỌC:
${lessonContext}${noteContext ? '\n\nGHI CHÚ BÀI HỌC:\n' + noteContext : ''}

YÊU CẦU:
- Ưu tiên giải thích dựa trên ngữ cảnh bài học.
- Nếu cần dùng kiến thức ngoài tài liệu để làm rõ, mở phần đó bằng từ “Bổ sung:”.
- Không bịa số liệu, liều dùng hoặc khuyến cáo lâm sàng. Nếu không chắc, nói rõ.
- Trả lời súc tích nhưng đủ ý, dùng Markdown sạch: tiêu đề ##/###, gạch đầu dòng và **in đậm** khi phù hợp.
- Mọi công thức toán/hóa BẮT BUỘC phải nằm trong dấu phân cách LaTeX: dùng $...$ cho công thức trong dòng hoặc $$...$$ cho công thức riêng dòng. Tuyệt đối không xuất các lệnh như \frac, \varepsilon, \cdot, _{...}, ^{...} ở ngoài dấu $. Ví dụ đúng: $A = \varepsilon \cdot L \cdot C$.
- Trong LaTeX, ký hiệu phần trăm BẮT BUỘC phải escape thành \%, tuyệt đối không viết % trần trong công thức. Ví dụ đúng: $E_{1cm}^{1\%}$; ví dụ sai: $E_{1cm}^{1%}$.
- Không đặt công thức LaTeX bên trong cặp **...**; nếu cần nhấn mạnh, hãy nhấn mạnh phần chữ mô tả bên ngoài công thức.`;

  async function callModel(model){
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const response = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},
      body:JSON.stringify({
        contents:[{role:'user',parts:[{text:prompt}]}],
        generationConfig:{temperature:0.45,maxOutputTokens:4096}
      })
    });
    let data = {};
    try{ data = await response.json(); }catch(_){ }
    if(!response.ok){
      const err = new Error(data?.error?.message || `HTTP ${response.status}`);
      err.httpStatus = response.status;
      throw err;
    }
    const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();
    if(!text) throw new Error('AI không trả về nội dung.');
    return text;
  }

  try{
    const models = ['gemini-3.5-flash','gemini-3.1-flash-lite','gemini-2.5-flash'];
    let text = '';
    let lastErr = null;
    for(const model of models){
      try{ text = await callModel(model); break; }
      catch(err){
        lastErr = err;
        if(![400,401,403,404,405,429,500,503].includes(err.httpStatus)) break;
      }
    }
    if(!text) throw lastErr || new Error('Không thể kết nối Gemini.');
    renderAiKnowledgeAnswer(answerEl, text);
    saveAiKnowledgeEntry(topic, question, text);
    renderAiKnowledgeHistory(modal, topic);
  }catch(err){
    console.error(err);
    answerEl.textContent = 'Lỗi: ' + (err.message || 'Không thể hỏi AI lúc này.');
  }finally{
    askBtn.disabled = false;
  }
}


function renderMindmap(container){
  let md = currentLesson.mindmapMarkdown || '';
  if(!md.includes('##') && !md.includes('-')){
    md = `# ${currentLesson.name}\n## 1. Nội dung chính\n- Bấm "Nạp lại / Thêm tài liệu" để cập nhật.`;
  }

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="mindmap-help">
      <span class="hint">💡 <em>Bấm vào <strong>ô chữ</strong> hoặc nút <strong>› / ‹</strong> để Bật / Xổ nhánh. Bấm <strong>AI</strong> trên ô để hỏi thêm kiến thức.</em></span>
      <button class="btn ghost small" id="regenBtn">📚 Quản lý tài liệu</button>
    </div>
    <div class="mindmap-wrapper" id="mmWrap">
      <div class="mindmap-toolbar">
        <button id="expandAllBtn">📂 Mở tất cả</button>
        <button id="collapseAllBtn">📁 Thu gọn</button>
        <button id="zoomInBtn" title="Phóng to">＋</button>
        <button id="zoomOutBtn" title="Thu nhỏ">−</button>
        <button id="fitBtn">◎ Căn giữa</button>
      </div>
      <svg id="mindmapViewport" role="img" aria-label="Sơ đồ tư duy tương tác"></svg>
    </div>`;
  container.appendChild(wrap);

  function markdownToTree(markdown){
    const lines = markdown.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    let root = { name: toNFC(currentLesson.name || 'Chủ đề'), children: [] };
    let h2 = null, h3 = null;
    for(const line of lines){
      if(/^#\s+/.test(line) && !/^##/.test(line)){
        root.name = toNFC(line.replace(/^#\s+/, '').trim()) || root.name;
      } else if(/^##\s+/.test(line) && !/^###/.test(line)){
        h2 = { name: toNFC(line.replace(/^##\s+/, '').trim()), children: [] };
        root.children.push(h2); h3 = null;
      } else if(/^###\s+/.test(line)){
        if(!h2){ h2 = {name:'Nội dung',children:[]}; root.children.push(h2); }
        h3 = { name: toNFC(line.replace(/^###\s+/, '').trim()), children: [] };
        h2.children.push(h3);
      } else if(/^[-*+]\s+/.test(line)){
        const leaf = { name: toNFC(line.replace(/^[-*+]\s+/, '').trim()), children: [] };
        if(h3) h3.children.push(leaf); else if(h2) h2.children.push(leaf); else root.children.push(leaf);
      }
    }
    return root;
  }

  const data = markdownToTree(md);
  const root = d3.hierarchy(data);
  currentMmRoot = root;

  root.each(d => {
    if(d.depth >= 2 && d.children){ d._children = d.children; d.children = null; }
  });

  const svg = d3.select(wrap.querySelector('#mindmapViewport'));
  const viewportNode = svg.node();
  const scene = svg.append('g').attr('class','mm-scene');
  const linkLayer = scene.append('g').attr('class','mm-links');
  const nodeLayer = scene.append('g').attr('class','mm-nodes');

  const zoom = d3.zoom().scaleExtent([0.55, 2.8]).on('zoom', ev => scene.attr('transform', ev.transform));
  svg.call(zoom).on('dblclick.zoom', null);
  currentMmInstance = { svg, scene, zoom, root };

  const ctx = document.createElement('canvas').getContext('2d');
  const PAD_X = 15;
  const AI_BADGE_RESERVE = 34;
  const PAD_Y = 10;
  const LINE_H = 19;
  const TOGGLE_OFFSET = 18;
  const DEPTH_GAP = 88;
  const NODE_GAP_Y = 24; // khoảng trống tối thiểu giữa 2 ô theo chiều dọc

  function fontForDepth(depth){
    if(depth === 0) return '700 15px "Be Vietnam Pro", sans-serif';
    if(depth === 1) return '600 14px "Be Vietnam Pro", sans-serif';
    return '500 13.3px "Be Vietnam Pro", sans-serif';
  }
  function widthBoundsForDepth(depth){
    const isMobile = (window.innerWidth || 0) <= 768;
    if(depth === 0) return isMobile ? { min: 250, max: 360 } : { min: 280, max: 360 };
    if(depth === 1) return isMobile ? { min: 245, max: 330 } : { min: 240, max: 320 };
    if(depth === 2) return isMobile ? { min: 255, max: 350 } : { min: 250, max: 335 };
    return isMobile ? { min: 250, max: 330 } : { min: 245, max: 320 };
  }
  function rebalanceWrappedLines(lines, fullTextW){
    if(lines.length < 2) return lines;
    let changed = true;
    while(changed){
      changed = false;
      const last = lines[lines.length - 1] || '';
      const prev = lines[lines.length - 2] || '';
      const prevWords = prev.split(/\s+/).filter(Boolean);
      if(prevWords.length < 2) break;

      const lastWidth = ctx.measureText(last).width;
      const tooShortLastLine = lastWidth < fullTextW * 0.34 || last.split(/\s+/).filter(Boolean).length === 1;
      if(!tooShortLastLine) break;

      const movedWord = prevWords.pop();
      const newPrev = prevWords.join(' ');
      const newLast = movedWord + (last ? ' ' + last : '');
      const newPrevWidth = ctx.measureText(newPrev).width;
      const newLastWidth = ctx.measureText(newLast).width;

      if(newPrev && newPrevWidth <= fullTextW && newLastWidth <= fullTextW){
        lines[lines.length - 2] = newPrev;
        lines[lines.length - 1] = newLast;
        changed = true;
      }
    }
    return lines;
  }

  function wrapLines(text, depth, width){
    ctx.font = fontForDepth(depth);

    // Chỉ dòng đầu tiên chừa chỗ cho nút AI ở góc phải.
    // Các dòng sau dùng toàn bộ chiều rộng để tránh khoảng trống vô nghĩa.
    const firstLineW = width - PAD_X*2 - AI_BADGE_RESERVE;
    const fullTextW = width - PAD_X*2;

    const words = String(text || '').split(/\s+/).filter(Boolean);
    if(!words.length) return [''];

    const lines=[];
    let line='';

    for(const word of words){
      const lineLimit = lines.length === 0 ? firstLineW : fullTextW;
      const test = line ? line + ' ' + word : word;
      if(ctx.measureText(test).width <= lineLimit){
        line = test;
      }else{
        if(line) lines.push(line);
        line = word;
      }
    }
    if(line) lines.push(line);

    return rebalanceWrappedLines(lines, fullTextW);
  }

  function widthForDepth(depth, text){
    ctx.font = fontForDepth(depth);
    const bounds = widthBoundsForDepth(depth);
    const raw = String(text || '').trim();
    const words = raw.split(/\s+/).filter(Boolean);
    const longestWordW = words.length ? Math.max(...words.map(w => ctx.measureText(w).width)) : 0;

    // Đảm bảo tối thiểu vừa từ dài nhất và phần huy hiệu AI.
    const startWidth = Math.max(bounds.min, Math.min(bounds.max, Math.ceil(longestWordW + PAD_X*2 + 18)));

    let bestWidth = bounds.max;
    let bestScore = Infinity;

    for(let width = startWidth; width <= bounds.max; width += 6){
      const lines = wrapLines(raw, depth, width);
      const fullTextW = width - PAD_X*2;
      const last = lines[lines.length - 1] || '';
      const lastWidth = ctx.measureText(last).width;
      const lineCount = Math.max(1, lines.length);

      // Điểm thấp hơn là tốt hơn: ưu tiên ít dòng, dòng cuối không quá ngắn,
      // nhưng cũng không mở rộng ô vô ích.
      let score = lineCount * 22 + (width - bounds.min) * 0.12;
      if(lineCount > 1 && lastWidth < fullTextW * 0.28) score += 9;
      if(lineCount > 2) score += (lineCount - 2) * 6;

      if(score < bestScore){
        bestScore = score;
        bestWidth = width;
      }
    }

    return bestWidth;
  }
  function prepareNode(d){
    d._cardWidth = widthForDepth(d.depth, d.data.name || '');
    d._lines = wrapLines(d.data.name || '', d.depth, d._cardWidth);
    d._cardHeight = Math.max(42, PAD_Y*2 + d._lines.length*LINE_H);
  }
  function hasAnyChildren(d){ return !!((d.children && d.children.length) || (d._children && d._children.length)); }
  function toggleNode(d){
    if(!hasAnyChildren(d)) return;
    if(d.children){ d._children = d.children; d.children = null; }
    else { d.children = d._children; d._children = null; }
    update(d);
  }

  function update(source){
    // Chuẩn bị kích thước trước khi bố trí cây để D3 có thể chừa đúng
    // khoảng trống cho các ô cao/thấp khác nhau.
    const visibleBeforeLayout = root.descendants();
    visibleBeforeLayout.forEach(prepareNode);

    const tree = d3.tree()
      .nodeSize([1, 1])
      .separation((a,b) => {
        // Khoảng cách tâm-tâm = nửa chiều cao hai ô + khoảng trống.
        // Nhánh khác cha được nới thêm một chút để sơ đồ dễ đọc.
        const extra = a.parent === b.parent ? NODE_GAP_Y : NODE_GAP_Y + 12;
        return (a._cardHeight + b._cardHeight) / 2 + extra;
      });
    tree(root);

    const nodes = root.descendants();
    const links = root.links();

    const maxDepth = d3.max(nodes, d => d.depth) || 0;
    const depthWidths = Array.from({length:maxDepth+1}, (_,depth) => {
      const vals = nodes.filter(d=>d.depth===depth).map(d=>d._cardWidth);
      return vals.length ? d3.max(vals) : 220;
    });
    const depthX = [0];
    for(let depth=1; depth<=maxDepth; depth++){
      depthX[depth] = depthX[depth-1] + depthWidths[depth-1] + DEPTH_GAP + TOGGLE_OFFSET;
    }
    nodes.forEach(d => {
      d.plotX = depthX[d.depth] || 0;
      d.plotY = d.x;
    });

    const nodeSel = nodeLayer.selectAll('g.mm-node').data(nodes, d => d.data.__id || (d.data.__id = uid()));
    const enter = nodeSel.enter().append('g')
      .attr('class', d => `mm-node depth-${Math.min(d.depth,4)}`)
      .attr('transform', d => `translate(${source?.plotX ?? d.plotX},${source?.plotY ?? d.plotY})`)
      .style('opacity',0);

    enter.append('rect').attr('class','mm-node-card').attr('rx',9).attr('ry',9);
    enter.append('text').attr('class','mm-node-label');
    enter.append('title');
    enter.append('rect').attr('class','mm-hit').on('click', (ev,d)=>{ ev.stopPropagation(); toggleNode(d); });
    const tg = enter.append('g').attr('class','mm-toggle').on('click',(ev,d)=>{ev.stopPropagation();toggleNode(d);});
    tg.append('circle').attr('r',10);
    tg.append('text').attr('y',.5);

    const aiAsk = enter.append('g').attr('class','mm-ai-ask')
      .on('click',(ev,d)=>{ ev.stopPropagation(); openAiKnowledge(d.data.name || ''); });
    aiAsk.append('circle').attr('r',10);
    aiAsk.append('text').attr('y',.5).text('AI');
    aiAsk.append('title').text('Hỏi AI thêm về nội dung này');

    const merged = enter.merge(nodeSel);
    merged.attr('class', d => `mm-node depth-${Math.min(d.depth,4)}`)
      .transition().duration(260).ease(d3.easeCubicOut)
      .style('opacity',1)
      .attr('transform', d => `translate(${d.plotX},${d.plotY-d._cardHeight/2})`);

    merged.select('.mm-node-card')
      .attr('width', d => d._cardWidth)
      .attr('height', d => d._cardHeight);

    merged.select('.mm-node-label').each(function(d){
      const text = d3.select(this);
      text.selectAll('tspan').remove();
      d._lines.forEach((line,i) => {
        text.append('tspan')
          .attr('x', PAD_X)
          .attr('y', PAD_Y + LINE_H*(i+0.78))
          .text(toNFC(line));
      });
    });

    merged.select('title').text(d => toNFC(d.data.name || ''));
    merged.select('.mm-hit')
      .attr('width', d => d._cardWidth)
      .attr('height', d => d._cardHeight);
    merged.select('.mm-toggle')
      .style('display', d => hasAnyChildren(d) ? null : 'none')
      .attr('transform', d => `translate(${d._cardWidth+TOGGLE_OFFSET},${d._cardHeight/2})`);
    merged.select('.mm-toggle text').text(d => d.children ? '‹' : '›');
    merged.select('.mm-ai-ask')
      // Đặt nút AI trở lại bên trong góc phải của ô nội dung.
      // Phần chữ đã được chừa sẵn khoảng trống bên phải để không bị che.
      .attr('transform', d => `translate(${d._cardWidth - 18},18)`);

    nodeSel.exit().transition().duration(160).style('opacity',0).remove();

    function linkPath(l){
      const sx = l.source.plotX + l.source._cardWidth + (hasAnyChildren(l.source) ? TOGGLE_OFFSET+10 : 8);
      const sy = l.source.plotY;
      const tx = l.target.plotX;
      const ty = l.target.plotY;
      const bend = Math.max(38, (tx-sx)*0.5);
      return `M${sx},${sy} C${sx+bend},${sy} ${tx-bend},${ty} ${tx},${ty}`;
    }

    const linkSel = linkLayer.selectAll('path.mm-link').data(links, d => d.target.data.__id);
    linkSel.enter().append('path').attr('class','mm-link')
      .attr('d', d => {
        const x=source?.plotX||0, y=source?.plotY||0;
        return `M${x},${y} C${x},${y} ${x},${y} ${x},${y}`;
      })
      .merge(linkSel)
      .transition().duration(260).ease(d3.easeCubicOut)
      .attr('d',linkPath);
    linkSel.exit().transition().duration(160).style('opacity',0).remove();
  }

  function expandRecursively(d){
    if(d._children){ d.children=d._children; d._children=null; }
    if(d.children) d.children.forEach(expandRecursively);
  }
  function collapseFromDepth(d, depth){
    const kids = d.children || d._children;
    if(kids) kids.forEach(c => collapseFromDepth(c, depth));
    if(d.depth >= depth && d.children){ d._children=d.children; d.children=null; }
  }

  function readableFit(preferredScale=0.86){
    const box = scene.node().getBBox();
    if(!box.width || !box.height) return;
    const width = viewportNode.clientWidth, height = viewportNode.clientHeight;
    const marginX = 70, marginY = 64;
    const fitScale = Math.min((width-marginX*2)/box.width, (height-marginY*2)/box.height);
    const scale = Math.min(1.05, Math.max(0.72, Math.min(preferredScale, fitScale > 0.72 ? fitScale : preferredScale)));
    const rootNode = root;
    const rootCenterX = rootNode.plotX + rootNode._cardWidth/2;
    const rootCenterY = rootNode.plotY;
    const tx = Math.max(70, width*0.12) - rootCenterX*scale;
    const ty = height/2 - rootCenterY*scale;
    svg.transition().duration(320).ease(d3.easeCubicOut)
      .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
  }

  function centerCurrent(){
    readableFit(0.88);
  }

  update(root);
  setTimeout(() => readableFit(0.9), 90);

  wrap.querySelector('#expandAllBtn').onclick = () => {
    expandRecursively(root);
    update(root);
    setTimeout(() => readableFit(0.78), 220);
  };
  wrap.querySelector('#collapseAllBtn').onclick = () => {
    collapseFromDepth(root, 2);
    update(root);
    setTimeout(() => readableFit(0.9), 220);
  };
  wrap.querySelector('#zoomInBtn').onclick = () => svg.transition().duration(180).call(zoom.scaleBy,1.18);
  wrap.querySelector('#zoomOutBtn').onclick = () => svg.transition().duration(180).call(zoom.scaleBy,.85);
  wrap.querySelector('#fitBtn').onclick = centerCurrent;

  wrap.querySelector('#regenBtn').addEventListener('click', () => {
    // Không xoá dữ liệu bài học ngay. Chỉ mở màn hình quản lý tài liệu.
    // Tài liệu đã lưu sẽ tự nạp lại; người dùng có thể thêm/bớt rồi bấm Tạo để cập nhật bài.
    currentLesson = null;
    uploadedFilesQueue = [];
    renderMain();
  });
}

/* 8. QUIZ ENGINE */
function renderQuiz(container){
  container.innerHTML = '';
  const questions = (quiz.reviewMode && Array.isArray(quiz.reviewQuestions))
    ? quiz.reviewQuestions
    : (currentLesson.questions || []);

  const topControls = document.createElement('div');
  topControls.className = 'quiz-top-bar';
  topControls.innerHTML = `
    <div class="q-progress">${quiz.reviewMode ? 'Ôn câu sai · ' : ''}Câu ${quiz.done ? questions.length : quiz.index+1} / ${questions.length}</div>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <select id="quickCountSelect" style="padding:5px 8px; font-size:12.5px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-main);">
        <option value="10">10 câu</option>
        <option value="15" ${questions.length===15?'selected':''}>15 câu</option>
        <option value="20" ${questions.length===20?'selected':''}>20 câu</option>
        <option value="30" ${questions.length===30?'selected':''}>30 câu</option>
        <option value="40" ${questions.length===40?'selected':''}>40 câu</option>
      </select>
      <select id="quickLevelSelect" style="padding:5px 8px; font-size:12.5px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-main);">
        <option value="standard">Cân bằng</option>
        <option value="hard">Nâng cao / Bẫy</option>
        <option value="clinical">Thực hành / Ứng dụng</option>
      </select>
      <button class="btn ghost small" id="regenQuizBtn">🔄 Tạo bộ câu hỏi mới</button>
    </div>
  `;
  container.appendChild(topControls);

  const statusBox = document.createElement('div');
  statusBox.id = 'quizRegenStatus';
  statusBox.style.cssText = 'font-size:12.5px; margin-bottom:12px; min-height:16px;';
  container.appendChild(statusBox);

  topControls.querySelector('#regenQuizBtn').addEventListener('click', () => {
    const c = parseInt(document.getElementById('quickCountSelect').value, 10);
    const l = document.getElementById('quickLevelSelect').value;
    regenerateOnlyQuiz(c, l);
  });

  if(questions.length === 0){
    const emptyBox = document.createElement('div');
    emptyBox.className = 'card';
    emptyBox.textContent = 'Bài học này chưa có câu hỏi. Bấm "Tạo bộ câu hỏi mới" ở góc trên để tạo đề thi.';
    container.appendChild(emptyBox);
    return;
  }
  if(quiz.done){ renderQuizScore(container, questions); return; }

  const i = quiz.index;
  const q = questions[i];
  const box = document.createElement('div');
  box.className = 'q-box';
  box.innerHTML = `<div class="q-text"></div><div class="opts"></div>`;
  box.querySelector('.q-text').textContent = toNFC(q.question);
  const optsEl = box.querySelector('.opts');
  const already = quiz.answers[i];

  q.options.forEach((opt, idx) => {
    const o = document.createElement('div');
    o.className = 'opt' + (already !== undefined ? ' disabled' : '');
    o.innerHTML = `<span class="letter">${'ABCD'[idx]}</span><span></span>`;
    o.querySelector('span:last-child').textContent = toNFC(opt);

    if(already !== undefined){
      if(idx === q.correctIndex) o.classList.add('correct');
      else if(idx === already && already !== q.correctIndex) o.classList.add('wrong');
    }

    if(already === undefined){
      o.addEventListener('click', () => {
        quiz.answers[i] = idx;
        renderQuiz(container);
      });
    }
    optsEl.appendChild(o);
  });

  if(already !== undefined && q.explanation){
    const ex = document.createElement('div');
    ex.className = 'explain';
    const exTitle = document.createElement('strong');
    exTitle.textContent = '💡 Giải thích chi tiết:';
    const exText = document.createElement('div');
    exText.style.marginTop = '4px';
    exText.textContent = toNFC(q.explanation);
    ex.append(exTitle, exText);
    box.appendChild(ex);
  }

  const nav = document.createElement('div');
  nav.className = 'q-nav';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'btn ghost'; prevBtn.textContent = 'Câu trước'; prevBtn.disabled = i===0;
  prevBtn.addEventListener('click', () => { quiz.index--; renderQuiz(container); });
  
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn';
  nextBtn.textContent = i === questions.length-1 ? 'Xem tổng kết kết quả' : 'Câu tiếp theo';
  nextBtn.disabled = already === undefined;
  nextBtn.addEventListener('click', () => {
    if(i === questions.length-1){
      quiz.done = true;
      saveAttempt(questions);
      renderQuiz(container);
    } else {
      quiz.index++; renderQuiz(container);
    }
  });
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  box.appendChild(nav);
  container.appendChild(box);
}

async function saveAttempt(questions){
  const answers = questions.map((q, idx) => ({
    qid: q.id, question: q.question, options: q.options, explanation: q.explanation || '', chosenIndex: quiz.answers[idx],
    correctIndex: q.correctIndex, correct: quiz.answers[idx] === q.correctIndex
  }));
  const score = answers.filter(a => a.correct).length;
  const attempt = { date: Date.now(), score, total: questions.length, answers, mode: quiz.reviewMode ? 'wrong-review' : 'full' };
  const prev = getStore('attempts:'+currentLessonId) || [];
  prev.unshift(attempt);
  setStore('attempts:'+currentLessonId, prev);
  await syncToCloud();
}

function renderQuizScore(container, questions){
  const answers = questions.map((q, idx) => ({
    question: q.question, options: q.options,
    chosenIndex: quiz.answers[idx], correctIndex: q.correctIndex,
    correct: quiz.answers[idx] === q.correctIndex, explanation: q.explanation
  }));
  const score = answers.filter(a=>a.correct).length;
  const wrap = document.createElement('div');
  wrap.className = 'card score-card';
  const wrongQuestions = questions.filter((q, idx) => quiz.answers[idx] !== q.correctIndex);
  wrap.innerHTML = `<div class="score-num">${score}/${questions.length}</div><p style="color:var(--muted)">Số câu trả lời đúng</p>
    <div style="display:flex; justify-content:center; gap:8px; margin-top:14px; flex-wrap:wrap;">
      ${wrongQuestions.length ? `<button class="btn warm" id="retryWrongBtn">↻ Ôn lại ${wrongQuestions.length} câu sai</button>` : ''}
      <button class="btn${wrongQuestions.length ? ' ghost' : ''}" id="retryBtn">${quiz.reviewMode ? 'Làm lại bộ câu đang ôn' : 'Làm lại bài thi này'}</button>
      ${quiz.reviewMode ? '<button class="btn ghost" id="backFullQuizBtn">Quay lại bộ đề đầy đủ</button>' : ''}
    </div>
    ${wrongQuestions.length === 0 ? '<div style="margin-top:12px;color:var(--correct);font-weight:700;">🎉 Bạn đã trả lời đúng tất cả câu hỏi.</div>' : ''}`;
  container.appendChild(wrap);
  wrap.querySelector('#retryBtn').addEventListener('click', () => {
    const keepReviewMode = !!quiz.reviewMode;
    const keepReviewQuestions = keepReviewMode && Array.isArray(quiz.reviewQuestions) ? [...quiz.reviewQuestions] : [];
    quiz = {
      index:0, answers:[], started:false, done:false,
      reviewMode: keepReviewMode,
      reviewQuestions: keepReviewQuestions
    };
    renderQuiz(container);
  });

  const retryWrongBtn = wrap.querySelector('#retryWrongBtn');
  if(retryWrongBtn){
    retryWrongBtn.addEventListener('click', () => {
      quiz = {
        index:0,
        answers:[],
        started:false,
        done:false,
        reviewMode:true,
        reviewQuestions:[...wrongQuestions]
      };
      renderQuiz(container);
    });
  }

  const backFullQuizBtn = wrap.querySelector('#backFullQuizBtn');
  if(backFullQuizBtn){
    backFullQuizBtn.addEventListener('click', () => {
      quiz = {index:0, answers:[], started:false, done:false, reviewMode:false, reviewQuestions:[]};
      renderQuiz(container);
    });
  }

  const revWrap = document.createElement('div');
  revWrap.className = 'review-list';
  revWrap.style.marginTop = '20px';
  answers.forEach((a, idx) => {
    const item = document.createElement('div');
    item.className = 'rev-item';
    const top = document.createElement('div');
    const tag = document.createElement('span');
    tag.className = `tag ${a.correct?'ok':'bad'}`; tag.textContent = a.correct ? 'ĐÚNG' : 'SAI';
    const st = document.createElement('strong'); st.textContent = toNFC(`Câu ${idx+1}: ${a.question}`);
    top.append(tag, st);
    const choice = document.createElement('div'); choice.style.cssText='margin-top:6px;font-size:14px;';
    choice.append('Bạn chọn: ');
    const em = document.createElement('em'); em.textContent = toNFC(a.chosenIndex !== undefined ? a.options[a.chosenIndex] : '(chưa chọn)'); choice.appendChild(em);
    if(!a.correct){
      choice.append(' — 🎯 Đáp án đúng: ');
      const b = document.createElement('b'); b.style.color='var(--correct)'; b.textContent = toNFC(a.options[a.correctIndex] || ''); choice.appendChild(b);
    }
    item.append(top, choice);
    if(a.explanation){ const why=document.createElement('div'); why.style.cssText='margin-top:8px;color:var(--muted);font-size:13.5px;'; why.textContent='💡 '+toNFC(a.explanation); item.appendChild(why); }
    revWrap.appendChild(item);
  });
  container.appendChild(revWrap);
}

/* 9. REVIEW & LỊCH SỬ THI (CHUẨN GIỜ VIỆT NAM GMT+7) */
function renderHistory(container){
  const attempts = getStore('attempts:'+currentLessonId) || [];
  container.innerHTML = '';
  if(attempts.length === 0){
    container.innerHTML = '<div class="card">Chưa có lượt thi nào cho bài học này. Hãy làm bài thi ở tab Trắc nghiệm.</div>';
    return;
  }
  attempts.forEach((att) => {
    const item = document.createElement('div');
    item.className = 'hist-item';
    const d = new Date(att.date);
    item.innerHTML = `<span></span><span style="font-weight:600;color:var(--accent);">${att.score}/${att.total} câu đúng</span>`;
    
    // Luôn cố định múi giờ Việt Nam
    item.querySelector('span').textContent = d.toLocaleString('vi-VN', {
      timeZone: 'Asia/Ho_Chi_Minh',
      hour12: false,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
    item.addEventListener('click', () => renderAttemptDetail(container, att));
    container.appendChild(item);
  });
}

function renderAttemptDetail(container, att){
  const wrongAnswers = Array.isArray(att.answers) ? att.answers.filter(a => !a.correct) : [];

  container.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">
      <button class="btn ghost small" id="backBtn">← Quay lại danh sách lịch sử</button>
      ${wrongAnswers.length ? `<button class="btn warm small" id="reviewHistoryWrongBtn">↻ Ôn lại ${wrongAnswers.length} câu sai</button>` : ''}
    </div>
  `;

  const revWrap = document.createElement('div');
  revWrap.className = 'review-list';
  att.answers.forEach((a, idx) => {
    const item = document.createElement('div');
    item.className = 'rev-item';
    item.innerHTML = `<div><span class="tag ${a.correct?'ok':'bad'}">${a.correct?'ĐÚNG':'SAI'}</span><strong></strong></div><div class="hist-detail" style="margin-top:7px;font-size:13.5px;color:var(--muted)"></div>`;
    item.querySelector('strong').textContent = toNFC(`Câu ${idx+1}: ${a.question}`);
    const detail = item.querySelector('.hist-detail');
    if(Array.isArray(a.options)){
      const chosen = toNFC(a.chosenIndex !== undefined ? a.options[a.chosenIndex] : '(chưa chọn)');
      const correct = toNFC(a.options[a.correctIndex] || '');
      detail.textContent = `Bạn chọn: ${chosen}${a.correct ? '' : ' — Đáp án đúng: ' + correct}${a.explanation ? ' — ' + toNFC(a.explanation) : ''}`;
    }
    revWrap.appendChild(item);
  });
  container.appendChild(revWrap);

  container.querySelector('#backBtn').addEventListener('click', () => renderHistory(container));

  const reviewHistoryWrongBtn = container.querySelector('#reviewHistoryWrongBtn');
  if(reviewHistoryWrongBtn){
    reviewHistoryWrongBtn.addEventListener('click', () => {
      // Dùng chính câu sai của lần thi đã lưu để ôn lại, không tạo câu mới từ AI.
      const reviewQuestions = wrongAnswers.map((a, idx) => ({
        id: a.qid || `history-wrong-${att.date || Date.now()}-${idx}`,
        question: toNFC(a.question || ''),
        options: Array.isArray(a.options) ? a.options.map(opt => toNFC(opt)) : [],
        correctIndex: Number.isInteger(a.correctIndex) ? a.correctIndex : 0,
        explanation: toNFC(a.explanation || '')
      })).filter(q => q.question && q.options.length === 4);

      if(reviewQuestions.length === 0){
        alert('Không có đủ dữ liệu câu sai để ôn lại.');
        return;
      }

      quiz = {
        index: 0,
        answers: [],
        started: false,
        done: false,
        reviewMode: true,
        reviewQuestions
      };
      activeTab = 'quiz';
      renderMain();
    });
  }
}
