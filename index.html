<style>
  :root{
    --ink:#17201C;
    --paper:#F4F6F0;
    --card:#FFFFFF;
    --line:#DCE1D4;
    --muted:#636D64;
    --accent:#1E5E3A;
    --accent-soft:#E4EFE8;
    --warm:#B36B1B;
    --warm-soft:#F8F1E4;
    --correct:#2D7A46;
    --correct-soft:#E2F3E7;
    --wrong:#B83A2E;
    --wrong-soft:#FCEAE8;
    --radius:10px;
    --font-stack: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-stack) !important;
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  h1,h2,h3,h4,input,button,textarea,select,text,tspan{
    font-family:var(--font-stack) !important;
  }
  h1,h2,h3,h4{font-weight:700; margin:0 0 8px; letter-spacing:-0.2px;}
  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:300px; flex-shrink:0; background:var(--card);
    border-right:1px solid var(--line); padding:20px 16px;
    display:flex; flex-direction:column; gap:14px;
    height:100vh; position:sticky; top:0; overflow-y:auto;
  }
  .brand{display:flex; align-items:baseline; gap:8px; padding:0 4px 12px; border-bottom:1px solid var(--line);}
  .brand .mark{width:11px;height:11px;border-radius:50%;background:var(--accent); display:inline-block;}
  .brand h1{font-size:19px; letter-spacing:-0.3px;}
  
  .api-box{padding:10px; background:#fafbfa; border:1px solid var(--line); border-radius:8px;}
  .api-box label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600;}
  .api-box input{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px;}
  .api-box a{display:block; font-size:11px; color:var(--accent); margin-top:4px; text-decoration:none;}
  
  .subject-block{border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:4px;}
  .subject-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 6px; cursor:pointer; border-radius:8px;
  }
  .subject-head:hover{background:var(--accent-soft);}
  .subject-head .name{font-weight:600; font-size:14.5px; word-break:break-word;}
  .subject-head .chev{color:var(--muted); font-size:12px; transition:transform .15s;}
  .subject-head.open .chev{transform:rotate(90deg);}
  
  .action-btns{display:flex; align-items:center; gap:2px;}
  .action-btn{
    color:var(--muted); font-size:12px; cursor:pointer; padding:2px 5px; border-radius:4px; opacity:0;
    transition:opacity .15s ease;
  }
  .subject-head:hover .action-btn, .lesson-item:hover .action-btn{opacity:.85;}
  .action-btn:hover{color:var(--ink); background:#E6ECE2; opacity:1 !important;}
  .action-btn.del:hover{color:var(--wrong); background:var(--wrong-soft); opacity:1 !important;}

  .lesson-list{padding-left:14px; margin-top:4px; display:flex; flex-direction:column; gap:2px;}
  .lesson-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:7px 8px; border-radius:7px; cursor:pointer; font-size:13.5px; color:var(--ink);
    border-left:2px solid transparent;
  }
  .lesson-item:hover{background:var(--warm-soft);}
  .lesson-item.active{background:var(--warm-soft); border-left:2px solid var(--warm); font-weight:600;}
  
  .add-row{display:flex; gap:6px; padding:6px 4px 0;}
  .add-row input{
    flex:1; min-width:0; font-size:13px; padding:6px 8px; border:1px solid var(--line);
    border-radius:7px; background:#fff;
  }
  .btn{
    border:none; border-radius:7px; padding:7px 13px; font-size:13.5px; cursor:pointer;
    background:var(--ink); color:#fff; white-space:nowrap; font-weight:600;
  }
  .btn:hover{opacity:.9;}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn.warm{background:var(--warm);}
